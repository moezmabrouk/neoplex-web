  const cd=cfgDev();
  if(cd){const w=document.getElementById('sw-main');if(w)w.setAttribute('aria-checked',String(isOn(cd)));return;}
  const d=byId[ui.sel],s=d.s;
  if(d.pending)return;
  setText('sheetState',stateText(d));setText('lastCall',d.last||'aucun');
  const b=document.getElementById('badge');if(b)b.style.setProperty('--c',badgeColor(d));
  const sw=document.getElementById('sw-main');if(sw)sw.setAttribute('aria-checked',String(isOn(d)));
  if(d.kind==='light'){
    setText('bri-out',s.bri+' %');const r=document.getElementById('bri');if(r)r.style.setProperty('--p',((s.bri-1)/99*100).toFixed(1)+'%');
    if(capsOf(d)==='ct'||capsOf(d)==='rgbct')setText('ct-out',(s.k||3000)+' K');
  }
  if(d.kind==='tv'||d.kind==='speaker'){setText('vol-out',String(s.vol));const r=document.getElementById('vol');if(r)r.style.setProperty('--p',s.vol+'%');}
  if(d.kind==='cover'){setText('pos-out',s.pos+' %');const r=document.getElementById('pos');if(r){r.style.setProperty('--p',s.pos+'%');if(document.activeElement!==r)r.value=s.pos;}}
  if(d.kind==='camera')camTick(d);
  if(d.kind==='door'){setText('bigState',s.open?'Ouverte':'Fermée');setText('bigSub',since(s.since));}
  if(d.kind==='motion'){setText('bigState',s.active?'Mouvement':'Calme');setText('bigSub','dernier passage '+agoTxt(s.since));}
  if(d.kind==='thermo')setText('bigState',fr(air[d.zone])+' °C');
  if(d.kind==='radiator'||d.kind==='climate'){setText('tTarget',fr(s.target)+'°');setText('tNow',fr(air[d.zone])+' °C');}
}
function power(){
  let w=148;
  lamps().forEach(d=>{if(d.s.on)w+=d.watts*d.s.bri/100;});
  if(!byId.ecran.pending&&byId.ecran.s.on)w+=byId.ecran.watts;
  if(byId.tv.s.on)w+=86;
  w+=byId.arc.s.playing?11:3;w+=byId.era.s.playing?7:2;
  if(byId.cam.s.on)w+=3;
  return Math.round(w+Math.sin(performance.now()/2300)*3+Math.sin(performance.now()/610)*2);
}
function chip(id,cls,txt){const e=document.getElementById(id);e.className='chip'+(cls?' '+cls:'');setText(id+'Txt',txt);}
function refreshChips(){
  const n=lamps().filter(d=>d.s.on).length,st=alarm.state;
  /* consommation : simulée en démo ; reliée à HA, moyenne réelle sur 7 jours (masquée si indisponible) */
  const pw=!ha.cfg?power()+' W':ha.ready&&watt.data?Math.round(watt.data.w)+' W':'';
  $('#chipPower').hidden=!pw;
  chip('chipLights',n?'on':'',n===0?'Lumières éteintes':n===1?'1 lumière':n+' lumières');
  chip('chipAlarm',st==='triggered'?'alert':st==='disarmed'||st==='unavailable'?'':'armed',vw<430&&(st==='armed_home'||st==='armed_away')?'Armée':AL[st]);
  $('#chipAlarm').setAttribute('aria-label','Alarme : '+AL[st]+'. Ouvrir les réglages de l’alarme');
  chip('chipTemp',heating(byId.rad_salon)?'on':'',fr(air.salon)+' °C');
  if(pw)chip('chipPower','',pw);
  wxChip();
  scnRefresh();
}
function refreshUI(light){
  refreshChips();
  if(light)syncSheet();else renderSheet();
}
function openSheet(id){
  if(addUi.placing)placeEnd();
  ui.sel=id;sheet.classList.toggle('is-list',id==='list');sheet.classList.toggle('is-wx',id==='wx');sheet.classList.add('open');renderSheet();
  if(narrow)dock.classList.add('away');
  hideHint();
}
function closeSheet(){
  ui.sel=null;sheet.classList.remove('open');dock.classList.remove('away');measure();
}
function act(name,el,live){
  if(name==='close'){closeSheet();return;}
  if(name==='wxTgl'){wxToggle();renderSheet();return;}
  if(name==='open'){const o=byId[el.dataset.id];if(o&&o.pending){cfgUi.q='';openSheet('cfg:'+o.id);}else openSheet(el.dataset.id);return;}
  if(name==='qtoggle'){toggleDev(byId[el.dataset.id]);refreshUI(true);return;}
  if(name==='al'){setAlarm(el.dataset.v);return;}
  if(name==='cfg'){cfgUi.q='';openSheet('cfg:'+el.dataset.id);return;}
  if(name==='cback'){openSheet('list');return;}
  if(name==='hretry'){if(ha.cfg){ha.tries=0;ha.authFailed=false;haConnect();$('#live').textContent='Connexion à Home Assistant…';}else showSetup('');return;}
  if(ui.sel==='lights'){lightsAct(name,el);return;}
  if(scnKey()){scnAct(name,el);return;}
  if(ui.sel==='power'){if(name==='wretry'){wattFetch(true);renderSheet();}return;}
  if(name==='addOpen'){Object.assign(addUi,{name:'',room:ROOM_ORDER[0],kind:'light',ent:'',q:''});openSheet('add');return;}
  if(ui.sel==='add'){
    if(name==='aent'){addUi.ent=el.dataset.e;addUi.q='';renderSheet();}
    else if(name==='aentdel'){addUi.ent='';renderSheet();}
    else if(name==='addPlace')placeStart();
    return;
  }
  if(name==='delAsk'){delAsk(cfgDev()||byId[ui.sel]);return;}
  const cd=cfgDev();
  if(cd){
    if(name==='cadd'){const e=el.dataset.e;cfgUi.q='';saveCfg(cd,{ents:MULTI[cd.kind]?cd.ents.concat([e]):[e]});cfgChanged(cd);}
    else if(name==='cdel'){const a=cd.ents.slice();a.splice(+el.dataset.i,1);saveCfg(cd,{ents:a});cfgChanged(cd);}
    else if(name==='ccaps'){saveCfg(cd,{caps:el.dataset.v});cfgChanged(cd);}
    else if(name==='cinv'){saveCfg(cd,{inv:!cd.inv});cfgChanged(cd);}
    else if(name==='creset'){const n=document.getElementById('cfgName');if(n)n.value=cd.def.name;delete devCfg[cd.id];saveCfg(cd,{});cfgUi.shown='';cfgChanged(cd);}
    else if(name==='ctest'){toggleDev(cd);refreshUI(true);}
    return;
  }
  const d=byId[ui.sel];if(!d||d.pending)return;
  if(name==='toggle')toggleDev(d);
  else if(name==='bri')hub('light','turn_on',d,{brightness_pct:+el.value});
  else if(name==='rgb')hub('light','turn_on',d,{rgb_color:el.dataset.rgb.split(',').map(Number)});
  else if(name==='hue')hub('light','turn_on',d,{rgb_color:hue2rgb(+el.value)});
  else if(name==='ct')hub('light','turn_on',d,{color_temp_kelvin:+el.value});
  else if(name==='src')hub('media_player','select_source',d,{source:el.dataset.v});
  else if(name==='vol')hub('media_player','volume_set',d,{volume_level:+el.value/100});
  else if(name==='tminus')hub('climate','set_temperature',d,{temperature:clamp(Math.round((d.s.target-0.5)*2)/2,12,26)});
  else if(name==='tplus')hub('climate','set_temperature',d,{temperature:clamp(Math.round((d.s.target+0.5)*2)/2,12,26)});
  else if(name==='sim')simulate(d);
  else if(name==='pos')hub('cover','set_cover_position',d,{position:+el.value});
  else if(name==='cop')hub('cover','open_cover',d);
  else if(name==='ccl')hub('cover','close_cover',d);
  else if(name==='cstop')hub('cover','stop_cover',d);
  $('#live').textContent=d.name+' : '+stateText(d);
  refreshUI(live);
}
sheet.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&b.type!=='range')act(b.dataset.act,b,false);});
sheet.addEventListener('input',e=>{
  if(scnKey()&&e.target.id==='scnQ'){scnUi.q=e.target.value;const l=$('#scnCands');l.innerHTML=scnCandsHTML();l.scrollTop=0;return;}
  if(scnKey()&&e.target.id==='pillName'){pillNameInput(e.target.value);return;}
  if(ui.sel==='add'){
    if(e.target.id==='addName')addUi.name=e.target.value;
    else if(e.target.id==='addQ'){addUi.q=e.target.value;const l=$('#addCands');l.innerHTML=addCandsHTML();l.scrollTop=0;}
    return;
  }
  const cd=cfgDev();
  if(cd&&e.target.id==='cfgQ'){cfgUi.q=e.target.value;const l=$('#cfgCands');l.innerHTML=candsHTML(cd);l.scrollTop=0;setText('cfgN',String(cfgUi.n));return;}
  const b=e.target.closest('[data-act]');if(b&&b.type==='range')act(b.dataset.act,b,true);
});
sheet.addEventListener('change',e=>{
  if(ui.sel==='add'){
    if(e.target.id==='addRoom')addUi.room=e.target.value;
    /* le type change le domaine attendu : l'entité choisie n'est plus forcément valable */
    else if(e.target.id==='addKind'){addUi.kind=e.target.value;addUi.ent='';renderSheet();}
    return;
  }
  const cd=cfgDev();
  if(cd&&e.target.id==='cfgName'){saveCfg(cd,{name:e.target.value.trim()||cd.def.name});e.target.value=cd.name;return;}
  const d=byId[ui.sel];if(d&&d.kind==='light'&&e.target.type==='range')renderSheet();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!hideDlg()&&ui.sel)closeSheet();});
/* application Android : le bouton retour ferme la fenêtre ou la fiche ouverte avant de quitter */
window.neoplexBack=function(){if(hideDlg())return true;if(ui.sel){closeSheet();return true;}return false;};
/* le menu contextuel reste disponible dans les champs (coller le jeton) */
window.addEventListener('contextmenu',e=>{if(!(e.target.closest&&e.target.closest('input')))e.preventDefault();});
$('#btnList').addEventListener('click',()=>{if(ui.sel==='list')closeSheet();else openSheet('list');});
$('#chipAlarm').addEventListener('click',()=>{if(ui.sel==='alarm')closeSheet();else openSheet('alarm');});
$('#chipLights').addEventListener('click',()=>{if(ui.sel==='lights')closeSheet();else openSheet('lights');});
$('#chipPower').addEventListener('click',()=>{if(ui.sel==='power')closeSheet();else{wattFetch(false);openSheet('power');}});
$('#chipWx').addEventListener('click',()=>{if(ui.sel==='wx')closeSheet();else openSheet('wx');});
$('#btnHome').addEventListener('click',()=>{
  cam.az=cam.az0+((cam.az-cam.az0+PI)%(2*PI)+2*PI)%(2*PI)-PI;
  cam.homing=true;
});
function setMode(m){
  ui.mode=m;document.documentElement.dataset.mode=m;
  const b=$('#btnDay');b.innerHTML=m==='day'?ICON.moon:ICON.sun;
  b.setAttribute('aria-label',(m==='day'?'Passer en ambiance nuit':'Passer en ambiance jour')+' · appui long : retour au mode automatique (soleil)');
  /* application Android : les barres système prennent la couleur du ciel */
  try{if(window.NeoplexNative)window.NeoplexNative.setBars(m==='day'?'#bfe6dc':'#0c2430',m==='day'?'#f6dcc6':'#1d4a50',m==='day');}catch(_){}
}
/* jour/nuit automatique : suit sun.sun (repli sur l'heure) ; un lever/coucher annule la surcharge manuelle */
function sunUp(){
  const s=ha.states['sun.sun'];
  if(s)return s.state==='above_horizon';
  const h=new Date().getHours();return h>=7&&h<19;
}
function applyDayNight(){
  const up=sunUp();
  if(up!==ui.sun){ui.sun=up;ui.ovr=null;}
  setMode(ui.ovr||(up?'day':'night'));
}
{
  const b=$('#btnDay');let lp=null,lpDone=false;
  const cancel=()=>{clearTimeout(lp);lp=null;};
  b.addEventListener('pointerdown',()=>{lpDone=false;cancel();lp=setTimeout(()=>{
    lp=null;lpDone=true;ui.ovr=null;applyDayNight();
    $('#live').textContent='Ambiance jour/nuit : mode automatique';
  },500);});
  b.addEventListener('pointerup',cancel);b.addEventListener('pointerleave',cancel);b.addEventListener('pointercancel',cancel);
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('click',()=>{
    if(lpDone){lpDone=false;return;}
    ui.ovr=ui.mode==='day'?'night':'day';setMode(ui.ovr);
  });
}
const hint=$('#hint');
const HINT_TXT=COARSE?'Appui : allumer ou éteindre · appui long : réglages':'Clic : allumer ou éteindre · clic long : réglages';
hint.textContent=HINT_TXT;
/* pendant le placement d'un équipement, la consigne reste affichée */
function hideHint(){if(!addUi.placing)hint.classList.add('gone');}

/* ---------- gestes ---------- */
const ptr=new Map();let drag=null,pinch=null;
function pinchState(){const p=[...ptr.values()];return{d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};}
canvas.addEventListener('pointerdown',e=>{
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});cam.homing=false;
  if(ptr.size===1)drag={x0:e.clientX,y0:e.clientY,t0:performance.now(),moved:false};
  else{if(drag)drag.moved=true;pinch=pinchState();}
});
canvas.addEventListener('pointermove',e=>{
  const p=ptr.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse')canvas.style.cursor=pick(e.clientX,e.clientY,26)?'pointer':'';return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===1&&drag){
    if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>7){drag.moved=true;hideHint();}
    if(drag.moved){cam.az-=dx*0.0075;cam.el=clamp(cam.el+dy*0.005,0.32,1.25);}
  }else if(ptr.size===2){
    const s=pinchState();
    if(pinch){
      cam.zoom=clamp(cam.zoom*s.d/Math.max(pinch.d,1),0.6,5);
      cam.pan[0]=clamp(cam.pan[0]+(s.cx-pinch.cx)/cam.ppu,-7,7);
      cam.pan[1]=clamp(cam.pan[1]-(s.cy-pinch.cy)/cam.ppu,-7,7);
    }
    pinch=s;hideHint();
  }
});
function up(e){
  if(!ptr.has(e.pointerId))return;
  ptr.delete(e.pointerId);
  if(ptr.size<2)pinch=null;
  if(ptr.size===0){
    if(drag&&!drag.moved&&e.type==='pointerup'&&addUi.placing)placeAt(e.clientX,e.clientY);
    else if(drag&&!drag.moved&&e.type==='pointerup'){
      const held=performance.now()-drag.t0,d=pick(e.clientX,e.clientY,e.pointerType==='mouse'?26:34);
      if(d){
        /* appui court : bascule seulement ; appui long (≥ 500 ms) : la fiche de réglages */
        if(held>=500){if(d.pending){cfgUi.q='';openSheet('cfg:'+d.id);}else openSheet(d.id);}
        else if(tapToggles(d)){toggleDev(d);refreshUI(true);$('#live').textContent=d.name+' : '+stateText(d);}
        else{hint.textContent=(COARSE?'Appui long':'Clic long')+' : réglages de '+d.name;hint.classList.remove('gone');clearTimeout(hint.t);hint.t=setTimeout(()=>{if(!addUi.placing){hint.textContent=HINT_TXT;hideHint();}},2500);}
      }else if(ui.sel&&held<650)closeSheet();
    }
    drag=null;
  }
}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.homing=false;cam.zoom=clamp(cam.zoom*Math.exp(-e.deltaY*0.0015),0.6,5);hideHint();},{passive:false});
canvas.addEventListener('keydown',e=>{
  const k=e.key;let used=true;
  if(k==='ArrowLeft')cam.az+=0.16;else if(k==='ArrowRight')cam.az-=0.16;
  else if(k==='ArrowUp')cam.el=clamp(cam.el+0.08,0.32,1.25);else if(k==='ArrowDown')cam.el=clamp(cam.el-0.08,0.32,1.25);
  else if(k==='+'||k==='=')cam.zoom=clamp(cam.zoom*1.15,0.6,5);else if(k==='-')cam.zoom=clamp(cam.zoom/1.15,0.6,5);
  else used=false;
  if(used){e.preventDefault();cam.homing=false;}
});

/* ---------- mise en page ---------- */
function measure(){
  padTg=$('.top').getBoundingClientRect().bottom+8;
  padBg=ui.sel&&narrow?Math.min(sheet.offsetHeight,vh*(ui.sel==='list'?0.58:0.74))+8:(vh-dock.getBoundingClientRect().top)+6;
}
function resize(){
  vw=canvas.clientWidth||1;vh=canvas.clientHeight||1;dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);
  narrow=vw<760;defaults();measure();
  if(!ui.sel||!narrow)dock.classList.remove('away');
}
window.addEventListener('resize',resize);

/* ---------- démarrage ---------- */
function frame(now){
  const t=now/1000,dt=Math.min(0.05,Math.max(0.001,t-lastT));lastT=t;
  camUpdate(dt);step(dt,t);wxStep(dt,t);draw(t);placeLabels();
  requestAnimationFrame(frame);
}
function start(saved){
  saved=saved||{};
  ui.sun=sunUp();
  if(saved.mode&&saved.mode!==(ui.sun?'day':'night'))ui.ovr=saved.mode;   /* mode sauvegardé = surcharge initiale */
  if(saved.v===2){
    if(saved.states)devices.forEach(d=>{if(saved.states[d.id]&&!d.pending){Object.assign(d.s,saved.states[d.id]);if(d.kind==='motion')d.s.active=false;}});
    if(saved.air)Object.assign(air,saved.air);
    if(saved.alarm&&AL[saved.alarm]&&saved.alarm!=='triggered')alarm.state=saved.alarm;
  }
  applyDayNight();
  dayCur=ui.mode==='day'?1:0;
  wxInit();
  refreshChips();
  haConnect();
  if(!gl)return;
  initScene();resize();padT=padTg;padB=padBg;
  cam.az=cam.az0;cam.el=cam.el0;
  if(saved.cam){cam.az=saved.cam[0];cam.el=saved.cam[1];cam.zoom=saved.cam[2];}
  else if(!RM){cam.az=cam.az0+0.75;cam.zoom=0.82;cam.homing=true;}
  setTimeout(hideHint,9000);
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({v:2,mode:ui.mode,cam:[cam.az,cam.el,cam.zoom],alarm:alarm.state,air,states:devices.reduce((o,d)=>{o[d.id]=d.s;return o;},{})}));
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
