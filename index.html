<!DOCTYPE html>
<html lang="fr" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neoplex</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  /* Plein écran : le diorama au centre, un chrome discret en haut, la feuille de commande en bas. */
  --sky-top:#0c2430;
  --sky-bot:#1d4a50;
  --ink:#f4ece1;
  --ink-soft:rgba(244,236,225,.68);
  --panel:rgba(13,34,42,.8);
  --panel-line:rgba(244,236,225,.16);
  --track:rgba(244,236,225,.16);
  --halo:rgba(4,16,22,.75);
  --inv:#10262d;
  --accent:#ff8f76;
  --ok:#8fe3b0;
  --warm:#ffd36b;
  --font-display:"Marcellus","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-mode="day"]{
  --sky-top:#bfe6dc;
  --sky-bot:#f6dcc6;
  --ink:#1d3a40;
  --ink-soft:rgba(29,58,64,.7);
  --panel:rgba(255,250,244,.84);
  --panel-line:rgba(29,58,64,.14);
  --track:rgba(29,58,64,.14);
  --halo:rgba(255,250,244,.9);
  --inv:#fff8f0;
  --accent:#d95a44;
  --ok:#2c9a68;
  --warm:#c98a00;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:linear-gradient(var(--sky-top),var(--sky-bot));
  color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.35;
  overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#gl:focus-visible{outline-offset:-4px}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;font-size:10.5px;transition:opacity .25s}
.room{
  position:absolute;left:0;top:0;font-family:var(--font-display);font-size:1em;letter-spacing:.18em;line-height:1.3;text-align:center;transition:opacity .25s;
  text-transform:uppercase;color:var(--ink);opacity:.86;white-space:nowrap;will-change:transform;
  text-shadow:0 0 6px var(--halo),0 1px 10px var(--halo);
}
#siren{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 90px 12px rgba(255,84,64,.6)}
body.alarm #siren{opacity:1;animation:throb 1.1s ease-in-out infinite}
@keyframes throb{50%{opacity:.4}}

.top{position:absolute;left:0;right:0;top:0;padding:14px 16px 0;display:grid;grid-template-columns:1fr auto;gap:10px 12px;pointer-events:none}
.tools{display:flex;gap:8px;pointer-events:auto}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--panel-line);background:var(--panel);display:grid;place-items:center;padding:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chips{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;margin:0;padding:5px 9px 5px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--panel-line);font-size:12px;line-height:1.35;font-variant-numeric:tabular-nums;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);flex:none}
.chip.on i{background:var(--warm)}
button.chip{pointer-events:auto;border-color:var(--ink-soft)}
button.chip svg{flex:none;color:var(--ink-soft)}
button.chip::after{content:"›";color:var(--ink-soft);margin-left:-1px}
button.chip.armed svg{color:var(--ok)}
button.chip.alert{background:var(--accent);border-color:transparent;color:#22110d;animation:throb 1.1s ease-in-out infinite}
button.chip.alert svg,button.chip.alert::after{color:#22110d}

.dock{position:absolute;left:0;right:0;bottom:0;padding:0 16px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none;transition:opacity .25s}
.dock.away{opacity:0}
.dock.away .scenes{pointer-events:none}
.hint{margin:0;font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);text-align:center;text-shadow:0 0 8px var(--halo);transition:opacity .6s}
.hint.gone{opacity:0}
.scenes{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.pill{padding:9px 16px;border-radius:999px;border:1px solid var(--panel-line);background:var(--panel);font-size:13.5px;letter-spacing:.03em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--inv);border-color:transparent}

.sheet{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:460px;max-height:74%;overflow:auto;
  background:var(--panel);border:1px solid var(--panel-line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:8px 18px 18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateY(105%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s;
  user-select:none;
}
.sheet.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.sheet.is-list{max-height:58%}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--panel-line);margin:0 auto 10px}
@media (min-width:760px){
  .sheet{left:auto;right:20px;bottom:20px;width:372px;border-radius:24px;border-bottom:1px solid var(--panel-line);transform:translateY(calc(100% + 40px))}
  .sheet.is-list{max-height:74%}
  .sheet.is-wx{left:0;right:0;margin:0 auto;width:min(560px,94vw);max-width:none;max-height:88vh}
  .sheet::before{display:none}
  .sheet{padding-top:16px}
  .top{padding:20px 24px 0}
}
.shd{display:flex;align-items:center;gap:12px}
.badge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--track);color:var(--c,var(--ink))}
.ttl{flex:1;min-width:0}
.ttl h2{font-family:var(--font-display);font-weight:400;font-size:18px;letter-spacing:.06em;margin:0;line-height:1.15}
.ttl p{margin:3px 0 0;font-size:13px;color:var(--ink-soft)}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-line);background:transparent;font-size:19px;line-height:1;padding:0 0 2px;flex:none}
.sw{width:54px;height:32px;border-radius:32px;border:1px solid var(--panel-line);background:var(--track);position:relative;flex:none;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--accent);border-color:transparent}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.field{margin-top:16px}
.lab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.lab output{font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:.04em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--track) var(--p,0%))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--track) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:0;margin-top:-8px;box-shadow:0 1px 6px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 6px rgba(0,0,0,.35)}
input.hue::-webkit-slider-runnable-track{background:linear-gradient(90deg,#ff5a5a,#ffd84d,#62e36a,#4fe0d6,#5a8cff,#c56bff,#ff5a8f)}
input.hue::-moz-range-track{background:linear-gradient(90deg,#ff5a5a,#ffd84d,#62e36a,#4fe0d6,#5a8cff,#c56bff,#ff5a8f)}
input.ct::-webkit-slider-runnable-track{background:linear-gradient(90deg,#ffb872,#fff1e0,#dce8ff)}
input.ct::-moz-range-track{background:linear-gradient(90deg,#ffb872,#fff1e0,#dce8ff)}
.sws{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-bottom:8px}
.swt{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.swt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--inv)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:8px 14px;border-radius:999px;border:1px solid var(--panel-line);background:transparent;font-size:13.5px}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--inv);border-color:transparent}
.btn{height:46px;border-radius:15px;padding:0 18px;border:1px solid var(--panel-line);background:transparent;font-weight:500;width:100%;margin-top:14px}
.btn.pri{background:var(--accent);color:#22110d;border-color:transparent}
.big{margin-top:16px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big strong{font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.big span{color:var(--ink-soft);font-size:13.5px}
.note{margin:8px 0 0;font-size:13.5px;color:var(--ink-soft)}
.note b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.thermo{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.rb{width:50px;height:50px;border-radius:50%;border:1px solid var(--panel-line);background:transparent;font-size:24px;line-height:1;padding:0 0 3px}
.tval{text-align:center}
.tval strong{display:block;font-family:var(--font-display);font-weight:400;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tval span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.wires{margin-top:16px;padding-top:12px;border-top:1px solid var(--panel-line);display:grid;gap:5px}
.wire{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;color:var(--ink-soft);margin:0}
.wire code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--ink);overflow-wrap:anywhere;text-align:right;user-select:text;-webkit-user-select:text}
.list{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.grp{margin:12px 2px 0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.li{display:flex;align-items:center;gap:8px}
.lib{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:1px solid var(--panel-line);border-radius:16px;padding:8px 12px 8px 8px}
.lib .badge{width:36px;height:36px;border-radius:12px}
.lib .txt{display:block;flex:1;min-width:0}
.lib b{display:block;font-weight:500;font-size:14.5px}
.lib small{display:block;font-size:12.5px;color:var(--ink-soft)}
.tag{flex:none;padding:2px 8px;border-radius:999px;border:1px dashed var(--ink-soft);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.chip.ok i{background:var(--ok)}
.chip.ko i{background:var(--accent)}
.dlg{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(4,16,22,.55)}
.dlg[hidden]{display:none}
.dlg form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;padding:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dlg h2{font-family:var(--font-display);font-weight:400;font-size:18px;letter-spacing:.06em;margin:0;line-height:1.15}
.dlg label{display:block;margin-top:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.dlg input[type=url],.dlg input[type=password]{display:block;width:100%;margin-top:6px;height:42px;border-radius:12px;border:1px solid var(--panel-line);background:var(--track);color:var(--ink);font:inherit;padding:0 12px;user-select:text;-webkit-user-select:text}
.dlg label.chk,.field label.chk{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)}
.dlg .err{margin:10px 0 0;min-height:1em;font-size:13px;color:var(--accent);overflow-wrap:anywhere}
.dlg .row{display:flex;gap:8px}
.dlg .lnk{background:none;border:0;padding:8px 0 0;font-size:12.5px;color:var(--ink-soft);text-decoration:underline}
.dlg .lnk[hidden]{display:none}
.chip[hidden]{display:none}
#chipWxIco{display:flex}
.wxg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.wxc{border:1px solid var(--panel-line);border-radius:14px;padding:8px 10px;min-width:0}
.wxc span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px}
.wxc b{display:flex;align-items:center;font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums}
.wxc em{font-style:normal}
.aqd{width:8px;height:8px;border-radius:50%;margin-right:6px;flex:none;background:var(--c)}
.chip.wxoff{opacity:.55;filter:grayscale(1)}
.sheet.is-wx{max-height:88vh}
.wxhd{display:flex;align-items:center;gap:16px;margin-top:12px}
.wxhd .wxi{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--track);flex:none}
.wxhd strong{display:block;font-family:var(--font-display);font-weight:400;font-size:46px;line-height:1.05;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.wxhd b{display:block;font-weight:500;font-size:18px;margin-top:2px}
.wxhd small{display:block;color:var(--ink-soft);font-size:13.5px;margin-top:2px}
.wxg{gap:10px}
.wxc{display:flex;gap:10px;align-items:flex-start;padding:10px 12px}
.wxc>i{flex:none;display:grid;place-items:center;color:var(--ink-soft);margin-top:1px}
.wxc>div{min-width:0}
.wxc b{font-size:15px}
.wxc small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px}
.wxsrc{font-size:11px;opacity:.75}
.ib.ok{color:var(--ok)}
.ib.ko{color:var(--accent)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.brandlogo{height:34px;width:auto;max-width:100%;display:block;object-fit:contain;object-position:left center}
.brandsub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.wxset{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--track)}
.wxset span{flex:1;min-width:0;font-size:14px}
.wxset small{display:block;font-size:12.5px;color:var(--ink-soft)}
.gear{width:36px;height:36px;border-radius:50%;border:1px solid var(--panel-line);background:transparent;display:grid;place-items:center;padding:0;flex:none;color:var(--ink-soft)}
.gear svg{width:18px;height:18px}
.sheet input[type=text]{display:block;width:100%;height:42px;border-radius:12px;border:1px solid var(--panel-line);background:var(--track);color:var(--ink);font:inherit;padding:0 12px;user-select:text;-webkit-user-select:text}
.sheet input[type=text]::placeholder{color:var(--ink-soft)}
.sheet select{display:block;width:100%;height:42px;border-radius:12px;border:1px solid var(--panel-line);background:var(--track);color:var(--ink);font:inherit;padding:0 12px}
.shd .add{width:auto;height:34px;margin:0;padding:0 12px;font-size:13.5px;flex:none}
.cand[aria-pressed="true"]{border-color:var(--accent)}
.ents{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ents .note{margin:0}
.ent{display:flex;align-items:center;gap:6px;max-width:100%;padding:4px 5px 4px 10px;border-radius:999px;border:1px solid var(--panel-line);background:var(--track);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.ent span{overflow-wrap:anywhere}
.ent button{width:24px;height:24px;border-radius:50%;border:0;background:var(--panel-line);font-size:15px;line-height:1;padding:0 0 2px;flex:none}
.cands{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;max-height:min(44vh,320px);overflow:auto}
.cands .note{margin:2px 0}
.cand{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--panel-line);border-radius:12px;padding:7px 10px}
.cand b{display:block;font-weight:500;font-size:13.5px}
.cand small{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--ink-soft);overflow-wrap:anywhere}
.cand.used b{color:var(--ink-soft)}
.row2{display:flex;gap:8px}
.lon{display:grid;gap:2px;padding:9px 12px;border:1px solid var(--panel-line);border-radius:16px}
.lon b{font-weight:500;font-size:14.5px}
.lon small{font-size:12.5px;color:var(--ink-soft)}
.lon .btn{margin-top:6px;height:40px}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.pill.missing{opacity:.5}
.pill.add{padding:9px 13px}
.pill.bound::after{content:"";display:inline-block;width:4px;height:4px;margin-left:6px;border-radius:50%;background:currentColor;vertical-align:middle;opacity:.7}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:18px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bar i{display:block;width:100%;min-height:2px;border-radius:6px 6px 2px 2px;background:var(--warm)}
.cam{display:block;width:100%;margin-top:14px;border-radius:14px;background:var(--track);min-height:150px;object-fit:cover}
.sheet .lnk{display:block;margin-top:10px;background:none;border:0;padding:6px 0;font-size:12.5px;color:var(--ink-soft);text-decoration:underline}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
#nogl[hidden]{display:none}
@media (max-width:380px){.brandlogo{height:28px}.brandsub{font-size:9.5px;letter-spacing:.1em}.tools{gap:6px}.ib{width:38px;height:38px}.chips{gap:4px}.chip{font-size:11.5px;gap:5px;padding:5px 8px 5px 6px}#chipPower i,button.chip::after{display:none}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.open,.sw::after,.dock,.hint{transition:none}body.alarm #siren,button.chip.alert{animation:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Vue 3D de l'appartement. Flèches pour tourner, plus et moins pour zoomer. La liste des équipements est accessible par le bouton en haut."></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="siren" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <img class="brandlogo" src="logo-neoplex.png" alt="Neoplex Systems">
    <p class="brandsub">Appartement 71</p>
  </div>
  <div class="tools">
    <button class="ib" id="btnHa" aria-label="Connexion à Home Assistant"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
    <button class="ib" id="btnDay" aria-label="Passer en ambiance jour"></button>
    <button class="ib" id="btnHome" aria-label="Recentrer la vue"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l7.5 4.3v8.4L12 20.5l-7.5-4.3V7.8z"/><path d="M12 12l7.3-4.1M12 12v8.3M12 12L4.7 7.9"/></svg></button>
    <button class="ib" id="btnList" aria-label="Configuration des équipements"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  </div>

      if(x[2]&&!(def&&x[2].join()===def.ents.join()))c.ents=x[2];else delete c.ents;
      if(Object.keys(c).length)devCfg[x[0]]=c;else delete devCfg[x[0]];

function domOf(e){return e.split('.')[0];}
function applyCfg(){

    const c=devCfg[d.id]||{};
    d.name=c.name||d.def.name;
    d.ents=(c.ents||d.def.ents).slice();
    d.capsCfg=c.caps||'auto';
    d.inv=(c.inv!=null)?!!c.inv:!!d.def.inv;

    d.ents.forEach(e=>{(byEntity[e]=byEntity[e]||[]).push(d);});
  });
}
applyCfg();
function saveCfg(d,patch){
  const c=Object.assign({},devCfg[d.id],patch);
  /* on ne garde que ce qui diffère des réglages d'origine */
  if(c.name===d.def.name)delete c.name;
  if(c.caps==='auto')delete c.caps;
  if(c.inv!=null&&!!c.inv===d.def.inv)delete c.inv;
  if(c.ents&&c.ents.join()===d.def.ents.join())delete c.ents;
  if(Object.keys(c).length)devCfg[d.id]=c;else delete devCfg[d.id];

/* type d'une lumière : choix manuel, sinon ce que Home Assistant annonce, sinon le type d'origine */
function capsOf(d){
  if(d.capsCfg&&d.capsCfg!=='auto')return d.capsCfg;
  if(d.ents.length&&d.ents.every(e=>domOf(e)!=='light'))return'onoff';
  const m=d.modes;
  if(m&&m.length){
    if(m.some(x=>/^(hs|xy|rgb|rgbw|rgbww)$/.test(x)))return m.indexOf('color_temp')>=0?'rgbct':'rgb';
    if(m.indexOf('color_temp')>=0)return'ct';
    if(m.indexOf('brightness')>=0||m.indexOf('white')>=0)return'dim';
    return'onoff';

function haLoad(){try{const c=JSON.parse(localStorage.getItem(HA_KEY)||'null');return c&&c.url&&c.token?c:null;}catch(_){return null;}}
function haWsUrl(u){
  u=u.trim().replace(/\/+$/,'').replace(/\/api\/websocket$/,'');
  if(!/^[a-z]+:\/\//i.test(u))u='http://'+u;
  return u.replace(/^https:\/\//i,'wss://').replace(/^http:\/\//i,'ws://')+'/api/websocket';

function haErrTxt(m){const e=m&&m.error;return e?(e.code?e.code+' · ':'')+(e.message||''):'échec';}
function haStatus(){

  chip('chipHa',ha.flash?'ko':st[0],ha.flash||st[1]);

function haRaw(msg,cb){msg.id=++ha.seq;if(cb)ha.cbs[msg.id]=cb;ha.ws.send(JSON.stringify(msg));}
function haSend(msg,cb){
  if(ha.ready&&ha.ws){
    try{haRaw(msg,cb);}catch(e){delete ha.cbs[msg.id];if(cb)cb({success:false,error:{message:String(e.message||e)}});}
    return;

/* key : regroupe les appels rapprochés (curseurs) pour n'envoyer que le dernier */
function haCall(domain,service,data,cb,key){
  const msg={type:'call_service',domain,service,service_data:data};
  if(!key){haSend(msg,cb);return;}
  clearTimeout(ha.deb[key]);
  ha.deb[key]=setTimeout(()=>{delete ha.deb[key];haSend(msg,cb);},150);
}
function haFlush(){
  const q=ha.queue;ha.queue=[];

    else haSend(it.msg,it.cb);

function haDrop(why){const cbs=ha.cbs;ha.cbs={};Object.keys(cbs).forEach(k=>cbs[k]({success:false,error:{message:why}}));}
function haRetry(){
  clearTimeout(ha.timer);

}
/* adresses à essayer : locale puis extérieure, sans vides ni doublons */
function haUrls(c){
  const r=[];
  [c.url,c.url2].forEach(u=>{u=(u||'').trim();if(u&&r.every(x=>haWsUrl(x)!==haWsUrl(u)))r.push(u);});
  return r;
}
/* échec avant auth_ok : adresse suivante rapidement, sinon boucle de reconnexion normale */
function haNext(){
  clearTimeout(ha.timer);clearTimeout(ha.wd);
  if(ha.hop+1<ha.urls.length){
    ha.hop++;ha.idx=(ha.idx+1)%ha.urls.length;
    ha.timer=setTimeout(()=>haConnect(true),HOP_MS);haStatus();return;
  }
  if(ha.fresh){ha.fresh=false;haStatus();showSetup('Serveur injoignable ('+ha.urls.join(' / ')+') : '+ha.err+'. Vérifie l’adresse et le réseau.');return;}
  haRetry();
}
function haConnect(hop){
  clearTimeout(ha.timer);clearTimeout(ha.wd);
  if(ha.ws){const o=ha.ws;ha.ws=null;o.onclose=null;try{o.close();}catch(_){}}
  ha.ready=false;ha.cfg=haLoad();
  if(!ha.cfg){haStatus();showSetup('');return;}
  ha.urls=haUrls(ha.cfg);
  if(hop!==true){
    const p=parseInt(localStorage.getItem(PICK_KEY),10)||0;
    ha.hop=0;ha.idx=p>0&&p<ha.urls.length?p:0;
  }
  const url=ha.urls[ha.idx];
  let ws;
  try{ws=new WebSocket(haWsUrl(url));}
  catch(e){ha.err='adresse invalide : '+String(e.message||e);haNext();return;}
  ha.ws=ws;haStatus();
  /* une adresse injoignable (IP locale vue de l'extérieur) peut rester bloquée : on n'attend pas */
  ha.wd=setTimeout(()=>{
    if(ha.ws!==ws||ha.ready)return;
    ha.ws=null;ws.onclose=null;try{ws.close();}catch(_){}
    haDrop('connexion perdue');ha.err='délai dépassé';haNext();
  },HOP_WAIT);
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}haMsg(ws,m);};
  ws.onclose=e=>{
    if(ha.ws!==ws)return;
    clearTimeout(ha.wd);
    const was=ha.ready;ha.ws=null;ha.ready=false;haDrop('connexion perdue');
    if(!ha.authFailed)ha.err='connexion fermée'+(e&&e.code?' ('+e.code+')':'');
    if(was){renderSheet();$('#live').textContent='Home Assistant hors ligne';}
    if(ha.authFailed){haStatus();return;}
    if(!was){haNext();return;}
    haRetry();

function haMsg(ws,m){

    try{ws.close();}catch(_){}
    showSetup('Authentification refusée par Home Assistant : '+ha.err);
  }else if(m.type==='auth_ok'){
    clearTimeout(ha.wd);
    ha.ready=true;ha.tries=0;ha.fresh=false;ha.authFailed=false;ha.err='';
    try{localStorage.setItem(PICK_KEY,String(ha.idx));}catch(_){}

      if(!r.success){haFlash('Lecture des états impossible : '+haErrTxt(r));return;}
      (r.result||[]).forEach(st=>haApply(st,true));

  }else if(m.type==='event'&&m.event&&m.event.event_type==='state_changed'){

/* état HA → équipement(s) reliés à cette entité ; renvoie true si l'état concerne la maquette */
function haApply(st,bulk){
  const id=st.entity_id;
  ha.states[id]=st;
  if(wxWatch(id)){wxUpdate();if(id==='sun.sun')applyDayNight();return true;}   /* météo : weather.*, sun.sun, capteur UV */
  if(id===ALARM_ENTITY){haAlarm(st);return true;}
  const list=byEntity[id];if(!list)return false;
  list.forEach(d=>haApplyDev(d,st,bulk));
  return true;

function haApplyDev(d,st,bulk){
  const id=st.entity_id,v=st.state,a=st.attributes||{},s=d.s,dom=domOf(id),ts=Date.parse(st.last_changed)||Date.now();
  const gone=v==='unavailable';
  d.est[id]={on:dom==='media_player'?v!=='off'&&v!=='standby'&&!gone:v==='on',gone};
  d.offline=d.ents.every(e=>d.est[e]&&d.est[e].gone);
  const anyOn=()=>d.ents.some(e=>d.est[e]&&d.est[e].on);
  if(d.kind==='tv'||d.kind==='speaker'){
    s.on=v!=='off'&&!gone;s.playing=v==='playing';
    if(a.volume_level!=null)s.vol=Math.round(a.volume_level*100);
    if(a.source)s.source=a.source;
    if(a.source_list&&a.source_list.length)d.sources=a.source_list.slice(0,12);
    return;
  }
  if(d.kind==='camera'){s.on=(dom==='light'||dom==='switch')?v==='on':!gone;if(a.entity_picture)d.pic=a.entity_picture;return;}
  if(d.kind==='cover'){
    /* moteur inversé (Tuya) : la position HA brute est retournée pour garder 0 = fermé, 100 = ouvert */
    if(!gone){const raw=(a.current_position!=null)?a.current_position:(v==='open'?100:0);s.pos=d.inv?100-raw:raw;}
    return;
  }
  if(d.kind==='light'||d.kind==='plug'){
    s.on=anyOn();
    if(gone||v==='unknown'||dom!=='light')return;
    if(a.supported_color_modes){
      d.modeBy=d.modeBy||{};d.modeBy[id]=a.supported_color_modes;
      d.modes=[].concat.apply([],d.ents.map(e=>d.modeBy[e]||[]));
    }
    /* bornes du blanc réglable annoncées par HA (défaut 2000–6500 K) */
    if(a.min_color_temp_kelvin)d.minK=a.min_color_temp_kelvin;
    if(a.max_color_temp_kelvin)d.maxK=a.max_color_temp_kelvin;
    if(v==='on'||d.ents.length===1){
      if(a.brightness!=null)s.bri=Math.max(1,Math.round(a.brightness/2.55));
      if(a.rgb_color)s.rgb=a.rgb_color.slice();
      if(a.color_temp_kelvin){s.k=a.color_temp_kelvin;s.rgb=k2rgb(s.k);}
    }
    return;
  }
  if(gone||v==='unknown')return;
  if(d.kind==='door'){s.open=v==='on';s.since=ts;if(!bulk)d.last='state_changed · '+v;}
  else if(d.kind==='motion'){s.active=v==='on';s.until=s.active?Infinity:0;s.since=ts;if(!bulk)d.last='state_changed · '+v;}
  else if(d.kind==='thermo'){const t=parseFloat(v);if(isFinite(t))air[d.zone]=t;}
  else if(d.kind==='radiator'||d.kind==='climate'){
    s.on=v!=='off';
    if(a.temperature!=null)s.target=a.temperature;
    if(a.current_temperature!=null)air[d.zone]=a.current_temperature;
  }
}

const ALMAP={armed_night:'armed_home',armed_custom_bypass:'armed_home',armed_vacation:'armed_away'};

/* commande UI → service HA : un appel par domaine réel (un équipement peut regrouper plusieurs entités) */
function haHub(service,d,data){
  const groups={},caps=d.kind==='light'?capsOf(d):'';
  d.ents.forEach(e=>{(groups[domOf(e)]=groups[domOf(e)]||[]).push(e);});
  Object.keys(groups).forEach(dom=>{
    let sd={};
    if(d.kind==='light'||d.kind==='plug'){
      /* on n'envoie que ce que cette lumière sait faire ; un interrupteur ne reçoit rien */
      if(dom==='light'&&service==='turn_on'){
        if(caps!=='onoff'&&data.brightness_pct!=null)sd.brightness_pct=data.brightness_pct;
        if((caps==='rgb'||caps==='rgbct')&&data.rgb_color)sd.rgb_color=data.rgb_color;
        if((caps==='ct'||caps==='rgb'||caps==='rgbct')&&data.color_temp_kelvin)sd.color_temp_kelvin=data.color_temp_kelvin;
      }
    }else sd=Object.assign({},data);
    let svc=service;
    if(dom==='cover'&&d.inv){
      if(svc==='set_cover_position'&&sd.position!=null)sd.position=100-sd.position;
      else if(svc==='open_cover')svc='close_cover';
      else if(svc==='close_cover')svc='open_cover';
    }
    const ents=groups[dom],name=dom+'.'+svc;
    sd.entity_id=ents.length>1?ents:ents[0];
    d.last=name+' · '+(ha.ready?'envoi…':'en attente');
    haCall(dom,svc,sd,m=>{
      d.last=name+(m.success?' · ok':' · erreur : '+haErrTxt(m));
      if(!m.success)haFlash(d.name+' : '+haErrTxt(m));
      refreshUI(true);
    },d.id+'|'+dom+'|'+svc);
  });
}

/* ---------- passerelle : mise à jour locale immédiate, puis appel Home Assistant si configuré ---------- */
function hub(domain,service,d,data,fromScene){
  if(d.gone)return;
  const s=d.s;data=data||{};
  if(domain==='light'){
    if(service==='turn_off')s.on=false;
    else{
      s.on=true;
      if(data.brightness_pct!=null)s.bri=data.brightness_pct;
      if(data.rgb_color)s.rgb=data.rgb_color.slice();
      if(data.color_temp_kelvin){s.k=data.color_temp_kelvin;s.rgb=k2rgb(s.k);}
    }
  }else if(domain==='media_player'){
    if(service==='turn_on')s.on=true;
    else if(service==='turn_off')s.on=false;
    else if(service==='select_source'){s.source=data.source;s.on=true;}
    else if(service==='volume_set')s.vol=Math.round(data.volume_level*100);
    else if(service==='media_play')s.playing=true;
    else if(service==='media_pause')s.playing=false;
  }else if(domain==='climate'){
    if(service==='set_temperature')s.target=data.temperature;
    else s.on=data.hvac_mode==='heat';
  }else if(domain==='switch'){
    s.on=service==='turn_on';
  }else if(domain==='cover'){
    if(service==='set_cover_position')s.pos=data.position;
    else if(service==='open_cover')s.pos=100;
    else if(service==='close_cover')s.pos=0;
  }
  if(ha.cfg&&!d.pending)haHub(service,d,data);
  else{
    const args=Object.keys(data).map(k=>k+': '+(Array.isArray(data[k])?'['+data[k].join(', ')+']':data[k])).join(', ');
    d.last=domain+'.'+service+(args?' · '+args:'');
  }
  if(!fromScene)setScene(null);
}
function isOn(d){return d.kind==='speaker'?!!d.s.playing:d.kind==='cover'?d.s.pos>0:!!d.s.on;}
function canToggle(d){return!d.pending&&(d.kind==='light'||d.kind==='plug'||d.kind==='tv'||d.kind==='speaker'||d.kind==='radiator'||d.kind==='climate'||d.kind==='cover'||camPowered(d));}
/* caméra alimentée par une prise : pilotable si son entité est une lumière ou un interrupteur */
function camPowered(d){return d.kind==='camera'&&!!d.ents&&d.ents.some(e=>{const m=domOf(e);return m==='light'||m==='switch';});}
/* appui sur la maquette : ce qui bascule tout de suite (le chauffage et les capteurs ouvrent seulement leur fiche) */
function tapToggles(d){return!d.pending&&!d.offline&&(d.kind==='light'||d.kind==='plug'||d.kind==='tv'||d.kind==='speaker');}
function toggleDev(d){
  const s=d.s;
  if(d.kind==='light')hub('light',s.on?'turn_off':'turn_on',d);
  else if(d.kind==='tv')hub('media_player',s.on?'turn_off':'turn_on',d);
  else if(d.kind==='speaker')hub('media_player',s.playing?'media_pause':'media_play',d);
  else if(d.kind==='plug')hub('switch',s.on?'turn_off':'turn_on',d);
  else if(d.kind==='radiator'||d.kind==='climate')hub('climate','set_hvac_mode',d,{hvac_mode:s.on?'off':'heat'});
  else if(d.kind==='cover')hub('cover',s.pos>0?'close_cover':'open_cover',d);
  else if(camPowered(d))hub('switch',s.on?'turn_off':'turn_on',d);
}
function heating(d){return!d.pending&&d.s.on&&d.s.target>air[d.zone]+0.12;}
function alarmChanged(){
  document.body.classList.toggle('alarm',alarm.state==='triggered');
  $('#live').textContent='Alarme : '+AL[alarm.state]+(alarm.cause?' · '+alarm.cause:'');

function setAlarm(service,code,remember){
  if(!ha.cfg){
    alarm.state=service==='alarm_disarm'?'disarmed':service==='alarm_arm_home'?'armed_home':'armed_away';
    alarm.cause='';alarm.last='alarm_control_panel.'+service;
    alarmChanged();
    return;
  }
  /* Alarmo exige un code pour désarmer : saisi par l'utilisateur, mémorisé seulement s'il le demande */
  let saved=false;
  if(service==='alarm_disarm'&&code==null){
    code=localStorage.getItem(CODE_KEY);
    if(!code){askCode('');return;}
    saved=true;
  }
  const name='alarm_control_panel.'+service,data={entity_id:ALARM_ENTITY};
  if(code!=null)data.code=String(code);
  alarm.last=name+' · '+(ha.ready?'envoi…':'en attente');
  if(ui.sel==='alarm')renderSheet();
  haCall('alarm_control_panel',service,data,m=>{
    if(m.success){
      alarm.last=name+' · ok';
      if(remember)localStorage.setItem(CODE_KEY,String(code));
    }else{
      const err=haErrTxt(m);
      alarm.last=name+' · erreur : '+err;haFlash('Alarme : '+err);
      if(service==='alarm_disarm'&&m.error&&m.error.code){
        if(saved)localStorage.removeItem(CODE_KEY);
        askCode((saved?'Code mémorisé refusé : ':'Code refusé : ')+err);
      }
    }
    alarmChanged();
  });
}
function alarmCheck(d){
  if(ha.cfg)return;
  if(alarm.state==='armed_away'||(alarm.state==='armed_home'&&d.kind==='door')){
    alarm.state='triggered';alarm.at=Date.now();
    alarm.cause=d.kind==='door'?d.name+' ouverte':d.name;
    alarmChanged();
  }
}
function triggerMotion(d){
  d.s.active=true;d.s.until=performance.now()+6500;d.s.since=Date.now();d.last='état reçu · on';
  alarmCheck(d);
}
function simulate(d){
  if(d.kind==='door'){
    d.s.open=!d.s.open;d.s.since=Date.now();d.last='état reçu · '+(d.s.open?'on':'off');
    if(d.s.open)alarmCheck(d);
  }else triggerMotion(d);
}

function program(vs,fs,names){
  const p=gl.createProgram();
  [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]].forEach(([t,src])=>{
    const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));
    gl.attachShader(p,s);
  });
  gl.bindAttribLocation(p,0,'aPos');gl.bindAttribLocation(p,1,'aNor');gl.bindAttribLocation(p,2,'aCol');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));
  const u={};names.forEach(n=>{u[n]=gl.getUniformLocation(p,n);});
  return{p,u};
}

/* ---------- géométrie ---------- */
function Geo(){this.a=[];}
Geo.prototype.v=function(p,n,c){this.a.push(p[0],p[1],p[2],n[0],n[1],n[2],c[0],c[1],c[2]);};
Geo.prototype.quad=function(p,q,r,s,n,c){this.v(p,n,c);this.v(q,n,c);this.v(r,n,c);this.v(p,n,c);this.v(r,n,c);this.v(s,n,c);};
Geo.prototype.box=function(x0,y0,z0,x1,y1,z1,c,top){
  this.quad([x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[0,1,0],top||c);
  this.quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[0,0,1],c);
  this.quad([x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[0,0,-1],c);
  this.quad([x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0],[1,0,0],c);
  this.quad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[-1,0,0],c);
  return this;
};
Geo.prototype.plate=function(x0,z0,x1,z1,y,c){this.quad([x0,y,z0],[x0,y,z1],[x1,y,z1],[x1,y,z0],[0,1,0],c);return this;};
Geo.prototype.prism=function(cx,cz,y0,y1,r0,r1,n,c,top){
  const ny=(r0-r1)/(y1-y0);
  for(let i=0;i<n;i++){
    const a0=i/n*6.2832,a1=(i+1)/n*6.2832,am=(a0+a1)/2;
    const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    this.quad([cx+c0*r0,y0,cz+s0*r0],[cx+c1*r0,y0,cz+s1*r0],[cx+c1*r1,y1,cz+s1*r1],[cx+c0*r1,y1,cz+s0*r1],V.norm([Math.cos(am),ny,Math.sin(am)]),c);
    if(r1>0.001){const t=top||c;this.v([cx,y1,cz],[0,1,0],t);this.v([cx+c0*r1,y1,cz+s0*r1],[0,1,0],t);this.v([cx+c1*r1,y1,cz+s1*r1],[0,1,0],t);}
  }
  return this;
};
Geo.prototype.octa=function(r,h,c){
  const T=[0,h,0],B=[0,-h,0],P=[[r,0,0],[0,0,r],[-r,0,0],[0,0,-r]];
  for(let i=0;i<4;i++){
    const p=P[i],q=P[(i+1)%4],mx=(p[0]+q[0])/2,mz=(p[2]+q[2])/2,l=Math.hypot(mx,mz);
    const nu=V.norm([mx/l*h,r*0.7071,mz/l*h]),nd=[nu[0],-nu[1],nu[2]];
    this.v(p,nu,c);this.v(q,nu,c);this.v(T,nu,c);
    this.v(p,nd,c);this.v(q,nd,c);this.v(B,nd,c);
  }
  return this;
};
Geo.prototype.ring=function(r0,r1,n,c){
  for(let i=0;i<n;i++){
    const a0=i/n*6.2832,a1=(i+1)/n*6.2832,c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    this.quad([c0*r0,0,s0*r0],[c1*r0,0,s1*r0],[c1*r1,0,s1*r1],[c0*r1,0,s0*r1],[0,1,0],c);
  }
  return this;
};
/* pose un objet modélisé face à +z, tourné de ry autour de la verticale */
Geo.prototype.put=function(sub,tx,tz,ry){
  const c=Math.cos(ry),s=Math.sin(ry),a=sub.a;
  for(let i=0;i<a.length;i+=9)this.a.push(c*a[i]+s*a[i+2]+tx,a[i+1],-s*a[i]+c*a[i+2]+tz,c*a[i+3]+s*a[i+5],a[i+4],-s*a[i+3]+c*a[i+5],a[i+6],a[i+7],a[i+8]);
  return this;
};

const H=0.8; /* hauteur de coupe des murs */
function hwall(g,z,x0,x1,t,gaps,c,top){
  let xs=x0;(gaps||[]).forEach(q=>{if(q[0]>xs)g.box(xs,0,z-t/2,q[0],H,z+t/2,c,top);xs=q[1];});
  if(x1>xs)g.box(xs,0,z-t/2,x1,H,z+t/2,c,top);
}
function vwall(g,x,z0,z1,t,gaps,c,top){
  let zs=z0;(gaps||[]).forEach(q=>{if(q[0]>zs)g.box(x-t/2,0,zs,x+t/2,H,q[0],c,top);zs=q[1];});
  if(z1>zs)g.box(x-t/2,0,zs,x+t/2,H,z1,c,top);
}
function tiles(g,x0,z0,x1,z1,sx,sz,cols,y){
  const nx=Math.max(1,Math.round((x1-x0)/sx)),nz=Math.max(1,Math.round((z1-z0)/sz)),dx=(x1-x0)/nx,dz=(z1-z0)/nz;
  for(let i=0;i<nx;i++)for(let j=0;j<nz;j++)g.plate(x0+i*dx,z0+j*dz,x0+(i+1)*dx,z0+(j+1)*dz,y||0,cols[(i*(cols.length>2?5:1)+j)%cols.length]);
}
function rail(g,x0,z0,x1,z1,c){
  const n=Math.max(1,Math.round(Math.hypot(x1-x0,z1-z0)/0.4)),s=0.018,hy=0.55;
  for(let i=0;i<=n;i++){const x=lerp(x0,x1,i/n),z=lerp(z0,z1,i/n);g.box(x-s,0,z-s,x+s,hy,z+s,c);}
  g.box(Math.min(x0,x1)-s*1.6,hy,Math.min(z0,z1)-s*1.6,Math.max(x0,x1)+s*1.6,hy+0.04,Math.max(z0,z1)+s*1.6,c);
}
function plant(g,x,z,s,C){
  g.prism(x,z,0,0.3*s,0.12*s,0.17*s,8,C.pot,C.soil);
  g.prism(x,z,0.3*s,0.8*s,0.3*s,0.2*s,6,C.leaf1,C.leaf2);
  g.prism(x,z,0.8*s,1.2*s,0.2*s,0.0,6,C.leaf2);
}
function table(g,x0,z0,x1,z1,h,C,Ct){
  g.box(x0,h-0.05,z0,x1,h,z1,Ct);
  [[x0+0.04,z0+0.04],[x1-0.09,z0+0.04],[x0+0.04,z1-0.09],[x1-0.09,z1-0.09]].forEach(p=>g.box(p[0],0,p[1],p[0]+0.05,h-0.05,p[1]+0.05,C));
}
function chairGeo(C,Ct){
  const g=new Geo(),w=0.21;
  [[-w,-w],[w-0.04,-w],[-w,w-0.04],[w-0.04,w-0.04]].forEach(p=>g.box(p[0],0,p[1],p[0]+0.04,0.42,p[1]+0.04,C));
  g.box(-w,0.42,-w,w,0.47,w,C,Ct);

}
function armchairGeo(C,Cd,Cl){

  g.box(-0.38,0,-0.36,0.38,0.36,0.36,C);
  g.box(-0.38,0.36,-0.36,0.38,0.78,-0.2,Cd,C);

function shelf(g,x0,z0,x1,z1,C,Ct,cols,gap){
  g.box(x0,0,z0,x1,0.9,z1,C,Ct);
  const ax=(x1-x0)>(z1-z0),o=ax?x0:z0,len=(ax?x1-x0:z1-z0)-0.08,n=Math.round(len/0.11),d=len/n;
  for(let i=0;i<n;i++){
    const a=o+0.04+i*d,b=a+d-0.015,h=0.94+0.08*Math.abs(Math.sin(i*2.3+1)),c=cols[(i*3+(i>>1))%cols.length];
    if(gap&&b>gap[0]&&a<gap[1])continue;
    if(ax)g.box(a,0.9,z0+0.05,b,h,z1-0.05,c);else g.box(x0+0.05,0.9,a,x1-0.05,h,b,c);
  }
}
function crib(g,x0,z0,x1,z1,C,Ct){
  const p=0.04,h=0.8;
  [[x0,z0],[x1-p,z0],[x0,z1-p],[x1-p,z1-p]].forEach(q=>g.box(q[0],0,q[1],q[0]+p,h,q[1]+p,C,Ct));
  g.box(x0,h-0.04,z0,x1,h,z0+p,C,Ct);g.box(x0,h-0.04,z1-p,x1,h,z1,C,Ct);
  g.box(x0,h-0.04,z0,x0+p,h,z1,C,Ct);g.box(x1-p,h-0.04,z0,x1,h,z1,C,Ct);
  let n=Math.round((z1-z0)/0.13);
  for(let i=1;i<n;i++){const z=lerp(z0,z1-0.02,i/n);g.box(x0+0.01,0.28,z,x0+0.03,h-0.04,z+0.02,C);g.box(x1-0.03,0.28,z,x1-0.01,h-0.04,z+0.02,C);}
  n=Math.round((x1-x0)/0.13);
  for(let i=1;i<n;i++){const x=lerp(x0,x1-0.02,i/n);g.box(x,0.28,z0+0.01,x+0.02,h-0.04,z0+0.03,C);g.box(x,0.28,z1-0.03,x+0.02,h-0.04,z1-0.01,C);}
  g.box(x0+0.02,0.22,z0+0.02,x1-0.02,0.34,z1-0.02,hex('#FFFFFF'));
  g.box(x0+0.04,0.34,z0+0.55,x1-0.04,0.37,z1-0.05,hex('#F7E3B5'));
}
function radGeo(len){
  const g=new Geo(),A=hex('#FFFDF8'),B=hex('#E7E1D8'),n=Math.max(4,Math.round(len/0.1)),d=len/n;
  for(let i=0;i<n;i++)g.box(i*d+0.01,0.14,0,(i+1)*d-0.01,0.6,0.07,i%2?B:A,A);
  g.box(0,0.11,0.005,len,0.15,0.065,B);g.box(0,0.59,0.005,len,0.63,0.065,A);
  g.box(len+0.01,0.12,0,len+0.11,0.21,0.08,hex('#F3F5F6'));

}
function towelGeo(len){
  const g=new Geo(),A=hex('#FFFDF8');
  g.box(0,0.12,0.01,0.03,0.98,0.05,A);g.box(len-0.03,0.12,0.01,len,0.98,0.05,A);

  g.box(len+0.01,0.12,0,len+0.1,0.21,0.07,hex('#F3F5F6'));

}

/* un équipement non relié est dessiné en transparence : il change de liste de rendu quand on le relie */
function setLayer(it,transparent){
  const from=transparent?opaque:transp,to=transparent?transp:opaque,i=from.indexOf(it);
  if(i>=0){from.splice(i,1);to.push(it);}
}
function syncPending(){

}

const BB=[[-0.3,6.9],[-0.5,1.95],[-1.1,12.55]];
const cam={az:0.785,el:0.6155,zoom:1,pan:[0,0],homing:false,az0:0.785,el0:0.6155,right:[1,0,0],up:[0,1,0],vp:IDENT,ppu:30};
let vw=1,vh=1,dpr=1,narrow=true,padT=110,padB=96,padTg=110,padBg=96,dayCur=0,lastT=0;
function defaults(){
  const portrait=vw/vh<0.8;
  cam.az0=portrait?0.42:0.785;cam.el0=portrait?0.8:0.6155;
}
function camUpdate(dt){
  if(cam.homing){
    const k=RM?1:1-Math.exp(-dt*3.4);
    cam.az=lerp(cam.az,cam.az0,k);cam.el=lerp(cam.el,cam.el0,k);cam.zoom=lerp(cam.zoom,1,k);
    cam.pan[0]=lerp(cam.pan[0],0,k);cam.pan[1]=lerp(cam.pan[1],0,k);
    if(Math.abs(cam.az-cam.az0)<0.002&&Math.abs(cam.zoom-1)<0.002&&Math.abs(cam.el-cam.el0)<0.002)cam.homing=false;
  }
  const kp=RM?1:1-Math.exp(-dt*9);
  padT=lerp(padT,padTg,kp);padB=lerp(padB,padBg,kp);
  const ce=Math.cos(cam.el),se=Math.sin(cam.el),sa=Math.sin(cam.az),ca=Math.cos(cam.az);
  const z=[sa*ce,se,ca*ce],x=[ca,0,-sa],y=V.cross(z,x);
  let mx=0,my=0;
  for(let i=0;i<8;i++){
    const p=[BB[0][i&1]-C0[0],BB[1][(i>>1)&1]-C0[1],BB[2][(i>>2)&1]-C0[2]];
    mx=Math.max(mx,Math.abs(V.dot(p,x)));my=Math.max(my,Math.abs(V.dot(p,y)));
  }
  const freeH=Math.max(140,vh-padT-padB);
  cam.ppu=Math.min((vw-20)/(2*mx),freeH/(2*my))*cam.zoom;
  const hw=vw/(2*cam.ppu),hh=vh/(2*cam.ppu),offY=(padB-padT)/2/cam.ppu;
  const eye=[C0[0]+z[0]*60,C0[1]+z[1]*60,C0[2]+z[2]*60];
  const view=mLook(eye,x,y,z);
  const proj=mOrtho(-hw-cam.pan[0],hw-cam.pan[0],-hh-offY-cam.pan[1],hh-offY-cam.pan[1],36,84);
  cam.vp=mMul(proj,view);cam.right=x;cam.up=y;
}
function toScreen(p){
  const m=cam.vp;
  return[((m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12])*0.5+0.5)*vw,(1-((m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13])*0.5+0.5))*vh];
}
/* inverse de toScreen à hauteur y fixée : la projection est orthographique, il reste un système 2×2 en x et z */
function screenToWorld(sx,sy,y){
  const m=cam.vp,nx=(sx/vw)*2-1,ny=1-(sy/vh)*2,det=m[0]*m[9]-m[8]*m[1];
  if(Math.abs(det)<1e-9)return null;
  const r0=nx-m[4]*y-m[12],r1=ny-m[5]*y-m[13];
  return[(r0*m[9]-m[8]*r1)/det,(m[0]*r1-m[1]*r0)/det];
}
function pick(x,y,rad){
  let best=null,bd=rad;
  devices.forEach(d=>{
    d.hits.concat([d.mark]).forEach(h=>{const s=toScreen(h),dd=Math.hypot(s[0]-x,s[1]-y);if(dd<bd){bd=dd;best=d;}});
  });
  return best;
}

/* ---------- simulation et animation ---------- */
const sim={motionIn:7,uiIn:1};
const MSIZE={light:1,plug:0.95,tv:1,speaker:1,camera:0.9,door:0.85,motion:0.85,radiator:0.85,thermo:0.8,climate:0.8,cover:0.85};
function markColor(d){
  const s=d.s,OFF=[0.47,0.54,0.62],IDLE=[0.8,0.85,0.9];
  if(d.pending)return[0.66,0.63,0.78];
  switch(d.kind){
    case'light':return s.on?mix3(rgbf(s.rgb),[1,1,1],0.2):OFF;
    case'tv':case'camera':case'plug':return s.on?[0.55,0.76,1]:OFF;
    case'speaker':return s.playing?[0.56,0.9,0.69]:OFF;
    case'door':return s.open?[1,0.5,0.42]:[0.56,0.89,0.69];
    case'motion':return s.active?[1,0.83,0.42]:IDLE;
    case'thermo':return IDLE;
    case'cover':return s.pos>0?[0.53,0.81,0.98]:IDLE;
    default:return!s.on?OFF:heating(d)?[1,0.66,0.36]:IDLE;
  }
}
function tvColor(t,src){
  const p=TVPAL[src]||TVPAL.TV,f=t*0.22,i=Math.floor(f)%p.length;
  return mix3(p[i],p[(i+1)%p.length],f-Math.floor(f));
}
const frameU={la:new Float32Array(NL*4),lb:new Float32Array(NL*3),lc:new Float32Array(NL*3),night:1};
function step(dt,t){
  const k=RM?1:1-Math.exp(-dt*7),kd=RM?1:1-Math.exp(-dt*2.6);
  dayCur=lerp(dayCur,ui.mode==='day'?1:0,kd);
  devices.forEach((d,i)=>{
    const s=d.s,v=d.v;
    if(d.kind==='light'){
      const c=capsOf(d),lit=!d.pending&&s.on;
      v.level=lerp(v.level,lit?(c==='onoff'?1:s.bri/100):0,k);
      v.rgb=mix3(v.rgb,rgbf(c==='rgb'||c==='ct'||c==='rgbct'?s.rgb:WARM),k);
      d.fx.emis=mix3(v.rgb,[1,1,1],0.15+0.3*v.level);d.fx.mix=clamp(v.level*8,0,1)*0.95;
    }else if(d.kind==='tv'||d.kind==='speaker'||d.kind==='camera'||d.kind==='plug'){v.level=lerp(v.level,!d.pending&&isOn(d)?1:0,k);}
    else if(d.kind==='door'){v.open=lerp(v.open,s.open?1:0,RM?1:1-Math.exp(-dt*4.5));}
    else if(d.kind==='cover'){
      v.pos=lerp(v.pos,s.pos,RM?1:1-Math.exp(-dt*3));
      const c=d.cv;d.fx.m=mTRS(c.x,0.42+(v.pos/100)*0.84,c.z,c.ry,c.w,0.84,0.035);
    }
    d.mcol=mix3(d.mcol,markColor(d),k);
    const sel=ui.sel===d.id||ui.sel==='cfg:'+d.id,sz=clamp(6.6/cam.ppu,0.09,0.26)*MSIZE[d.kind]*(d.pending?0.85:1)*(sel?1.4:1);
    const bob=RM?0:Math.sin(t*1.7+i*1.3)*0.04,rot=RM?0.6:t*(sel?2.2:0.8)+i;
    const pulse=(d.kind==='door'&&s.open)||(d.kind==='motion'&&s.active)?1+0.16*Math.sin(t*6):1;
    d.marker.m=mTRS(d.mark[0],d.mark[1]+sz*0.9+bob,d.mark[2],rot,sz*pulse,sz*pulse,sz*pulse);
    d.marker.emis=d.mcol;
  });
  /* chauffage : chaque pièce dérive lentement vers la consigne de son radiateur */
  RADS.forEach(d=>{
    if(!d.pending&&!ha.cfg)air[d.zone]+=((d.s.on?d.s.target:17.5)-air[d.zone])*dt*0.012;
    d.v.heat=lerp(d.v.heat,heating(d)?1:0,k);
    d.fx.emis=[1,0.6,0.34];d.fx.mix=d.v.heat*0.3;
  });
  /* détecteurs : passages simulés tant que la maison n'est pas vide */
  let changed=false;
  sim.motionIn-=dt;
  if(sim.motionIn<=0){
    sim.motionIn=14+Math.random()*18;
    /* avec Home Assistant, ce sont les vrais détecteurs qui parlent */
    const live=MOTION.filter(m=>!m.pending);
    if(live.length&&!ha.cfg&&(alarm.state==='disarmed'||alarm.state==='armed_home')){triggerMotion(live[(Math.random()*live.length)|0]);changed=true;}
  }
  MOTION.forEach(mo=>{
    if(mo.s.active&&performance.now()>mo.s.until){mo.s.active=false;mo.last='état reçu · off';changed=true;}
    mo.v.pulse=lerp(mo.v.pulse,mo.s.active?1:0,k);
    mo.rings.forEach((it,i)=>{
      const ph=RM?0.6:((t*0.55+i*0.5)%1),sc=0.12+ph*0.6;
      it.m=mTRS(mo.ring[0],0.02,mo.ring[1],0,sc,1,sc);
      it.alpha=mo.v.pulse*(1-ph)*0.9;it.emis=[1,0.83,0.42];it.show=it.alpha>0.01;
    });
  });
  sim.uiIn-=dt;
  if(sim.uiIn<=0||changed){sim.uiIn=2;refreshUI(true);}

  /* visuels */
  const tv=byId.tv;tv.v.rgb=tvColor(t,tv.s.source);dyn.screen.emis=mix3(tv.v.rgb,[1,1,1],0.25);dyn.screen.mix=tv.v.level*0.95;
  dyn.camDot.emis=[0.45,0.95,0.6];dyn.camDot.mix=byId.cam.v.level;
  const ec=byId.ecran;ec.v.rgb=[0.7,0.82,1];dyn.ecran.emis=[0.66,0.8,1];dyn.ecran.mix=ec.v.level*0.92;
  const eq=(arr,d,x,y,z0,dz)=>{
    const lvl=d.v.level,vol=0.55+d.s.vol/100;
    arr.forEach((it,i)=>{
      const h=lvl*vol*(0.03+0.11*Math.abs(Math.sin(t*(RM?0:3.1+i*0.83)+i*1.9)));
      it.show=lvl>0.02;it.m=mTRS(x,y,z0+i*dz,0,0.045,Math.max(h,0.001),0.045);it.emis=[0.62,0.93,0.74];
    });
  };
  eq(dyn.eqArc,byId.arc,0.357,0.47,8.7,0.2);
  eq(dyn.eqEra,byId.era,5.82,0.95,8.59,0.07);
  /* ouvrants */
  dyn.doorEn.m=mTRS(6.08,0,4.45,-1.5708-byId.door_en.v.open*1.3,1,1,1);
  dyn.doorCh.m=mTRS(1.5,0,-0.08,-byId.door_ch.v.open*1.25,1,1,1);
  dyn.doorBa.m=mTRS(1.72-byId.door_ba.v.open*0.68,0,0,0,1,1,1);
  /* lumières */
  const boost=lerp(1,0.34,dayCur),la=frameU.la,lb=frameU.lb,lc=frameU.lc;
  LIGHTS.forEach((L,i)=>{
    const v=byId[L.dev].v,kk=Math.pow(v.level,0.75)*L.I*boost;
    la[i*4]=L.A[0];la[i*4+1]=L.A[1];la[i*4+2]=L.A[2];la[i*4+3]=L.R;
    lb[i*3]=L.B[0];lb[i*3+1]=L.B[1];lb[i*3+2]=L.B[2];
    lc[i*3]=v.rgb[0]*kk;lc[i*3+1]=v.rgb[1]*kk;lc[i*3+2]=v.rgb[2]*kk;
  });
  frameU.night=1-dayCur;
}

/* ---------- météo extérieure : Home Assistant (met.no, Météo-France, sun.sun) + qualité de l'air Open-Meteo ---------- */
const WX_MAIN='weather.forecast_home',WX_MF='weather.meteo_france_forecast_for_city_rueil_malmaison_ile_de_france_92_fr_rueil_malmaison';
const WX_UV=/^sensor\.meteo_france.*_uv$/,WX_RAINP=/^sensor\.meteo_france.*_rain_chance$/;
const AQ_KEY='neoplex.aq',AQ_EVERY=15*60000;
const AQ_URL='https://air-quality-api.open-meteo.com/v1/air-quality?latitude=48.8925&longitude=2.1697&current=european_aqi,pm2_5,pm10,ozone,nitrogen_dioxide&timezone=Europe%2FParis';
const WX={raw:'',cond:'',label:'',storm:false,temp:null,hum:null,cloud:0,coverage:null,wind:null,gust:null,windDir:null,uv:null,press:null,dew:null,
  rain:0,snow:false,aqi:null,pm25:null,pm10:null,o3:null,no2:null,apparent:null,sunAz:null,sunEl:null,src:'',demo:'',off:false,rainChance:null,precip:null};
const WX_KEY='neoplex.wx';
/* condition HA → [condition normalisée, intensité de pluie, neige] */
const WX_NORM={rainy:['rain',0.5,0],pouring:['rain',1,0],'lightning-rainy':['rain',1,0],hail:['rain',1,0],'snowy-rainy':['snow',0.5,1],snowy:['snow',0,1],
  fog:['fog',0,0],cloudy:['cloud',0,0],'windy-variant':['cloud',0,0],lightning:['cloud',0,0],exceptional:['cloud',0,0],
  partlycloudy:['partly',0,0],windy:['partly',0,0],sunny:['clear',0,0],'clear-night':['clear',0,0]};
const WX_CLOUD={clear:0,partly:40,cloud:85,rain:100,snow:100,fog:90};
const WX_FR={'clear-night':'Nuit claire',sunny:'Ensoleillé',partlycloudy:'Éclaircies',cloudy:'Nuageux',rainy:'Pluie',pouring:'Forte pluie',
  'lightning-rainy':'Orages',lightning:'Orages secs',hail:'Grêle',snowy:'Neige','snowy-rainy':'Pluie et neige',fog:'Brouillard',
  windy:'Venteux','windy-variant':'Venteux et nuageux',exceptional:'Exceptionnel'};
/* mode démo : ?wx=clear|partly|cloudy|rain|storm|snow|fog force la condition sans toucher aux données HA */
const WX_DEMO={clear:['sunny',0],partly:['partlycloudy',40],cloudy:['cloudy',85],rain:['rainy',100],storm:['lightning-rainy',100],snow:['snowy',100],fog:['fog',90]};
const wxNum=v=>{const n=parseFloat(v);return isFinite(n)?n:null;};
function wxWatch(id){return domOf(id)==='weather'||id==='sun.sun'||WX_UV.test(id)||WX_RAINP.test(id);}
function wxUpdate(){
  const S=ha.states,ok=st=>st&&st.state!=='unavailable'&&st.state!=='unknown';
  const mf=ok(S[WX_MF])?S[WX_MF]:null;
  const main=ok(S[WX_MAIN])?S[WX_MAIN]:mf||Object.keys(S).filter(k=>domOf(k)==='weather'&&ok(S[k])).map(k=>S[k])[0]||null;
  const a=main&&main.attributes||{},b=mf&&mf.attributes||{};
  const pick=k=>wxNum(a[k])!=null?wxNum(a[k]):wxNum(b[k]),pickMf=k=>wxNum(b[k])!=null?wxNum(b[k]):wxNum(a[k]);
  WX.src=main?main.entity_id:'';WX.raw=main?main.state:'';
  WX.temp=pick('temperature');WX.hum=pick('humidity');WX.press=pick('pressure');WX.dew=pick('dew_point');
  WX.wind=pick('wind_speed');WX.windDir=pick('wind_bearing');WX.coverage=pick('cloud_coverage');
  WX.gust=pickMf('wind_gust_speed');WX.apparent=pickMf('apparent_temperature');
  WX.uv=pick('uv_index');
  if(WX.uv==null){const u=Object.keys(S).filter(k=>WX_UV.test(k)).map(k=>wxNum(S[k].state)).filter(v=>v!=null);WX.uv=u.length?u[0]:null;}
  WX.precip=pickMf('precipitation');
  const rp=Object.keys(S).filter(k=>WX_RAINP.test(k)).map(k=>wxNum(S[k].state)).filter(v=>v!=null);WX.rainChance=rp.length?rp[0]:null;
  const sa=S['sun.sun']&&S['sun.sun'].attributes||{};
  WX.sunAz=wxNum(sa.azimuth);WX.sunEl=wxNum(sa.elevation);
  wxNormalize();
}
function wxNormalize(){
  const dm=WX.demo?WX_DEMO[WX.demo]:null,raw=dm?dm[0]:WX.raw,n=WX_NORM[raw]||[raw?'cloud':'',0,0];
  WX.cond=n[0];WX.rain=n[1];WX.snow=!!n[2];WX.storm=raw==='lightning-rainy';
  /* couverture nuageuse absente : estimée depuis la condition */
  WX.cloud=dm?dm[1]:WX.coverage!=null?clamp(WX.coverage,0,100):(WX_CLOUD[WX.cond]||0);
  WX.label=raw?(WX_FR[raw]||raw)+(dm?' (démo)':''):'Pas de données';
}
/* qualité de l'air : rafraîchie toutes les 15 min, gardée sur le téléphone, échec silencieux */
function aqApply(c){if(!c)return;WX.aqi=wxNum(c.european_aqi);WX.pm25=wxNum(c.pm2_5);WX.pm10=wxNum(c.pm10);WX.o3=wxNum(c.ozone);WX.no2=wxNum(c.nitrogen_dioxide);}
function aqFetch(){
  if(typeof fetch!=='function')return;
  fetch(AQ_URL).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.current)return;
    aqApply(j.current);
    try{localStorage.setItem(AQ_KEY,JSON.stringify({t:Date.now(),c:j.current}));}catch(_){}
    refreshUI(true);
  }).catch(()=>{});
}
function aqLoop(delay){setTimeout(()=>{aqFetch();aqLoop(AQ_EVERY);},delay);}
function wxInit(){
  let q='';try{q=(new URLSearchParams(location.search).get('wx')||'').toLowerCase();}catch(_){}
  if(WX_DEMO[q])WX.demo=q;
  try{WX.off=localStorage.getItem(WX_KEY)==='off';}catch(_){}
  let age=Infinity;
  try{const c=JSON.parse(localStorage.getItem(AQ_KEY)||'null');if(c&&c.c){aqApply(c.c);age=Date.now()-(c.t||0);}}catch(_){}
  wxNormalize();
  aqLoop(Math.max(0,AQ_EVERY-age));
}

/* ---------- météo : effets 3D autour de l'appartement (base x −0.5→6.5, z −1.25→12.7) ---------- */
const wxV={cloud:0,rain:0,snow:0,fog:0,storm:0,sun:0,moon:0,flash:0,nextFlash:6,dx:0,dz:1,sp:0,tilt:0};
let wxSeed=11;
const wxRnd=()=>(wxSeed=(wxSeed*16807)%2147483647)/2147483647;
const WX_CLOUDS=[];
/* les nuages restent en anneau autour de l'île : jamais au-dessus de l'empreinte élargie de la base (caméra plongeante) */
const wxInBase=(x,z)=>x>=-1.2&&x<=7.2&&z>=-2&&z<=13.4;
function wxCloudOut(q){do{q.x=-8+wxRnd()*22;q.z=-8+wxRnd()*28;}while(wxInBase(q.x,q.z));return q;}
for(let i=0;i<18;i++)WX_CLOUDS.push({...wxCloudOut({}),y:4.5+wxRnd()*4.5,r:(1.1+wxRnd()*0.9)*1.3,l:(1.2+wxRnd()*2.2)*1.3,k:0.6+wxRnd()*0.4});
const WX_NDROP=640,WX_DROPS=[];
/* gouttes et flocons tombent autour de la base, jamais dedans */
function wxDrop(p,top){
  do{p.x=-8+Math.random()*22;p.z=-8+Math.random()*28;}while(p.x>-0.7&&p.x<6.7&&p.z>-1.45&&p.z<12.9);
  p.y=top?8:-1+Math.random()*9;p.ph=Math.random()*6.283;return p;
}
for(let i=0;i<WX_NDROP;i++)WX_DROPS.push(wxDrop({},false));
function wxSunPos(){
  /* hors connexion, le mode démo place un soleil (jour) ou une lune (nuit) fictifs */
  const fake=WX.sunEl==null&&WX.demo;
  return{az:fake?200:WX.sunAz,el:fake?(ui.mode==='day'?35:-35):WX.sunEl};
}
function wxStep(dt,t,snap){
  if(WX.off)return;   /* effet extérieur désactivé : rien n'évolue ni ne se dessine */
  const k=RM||snap?1:1-Math.exp(-dt*1.2),c=WX.cond,sp=wxSunPos();
  wxV.cloud=lerp(wxV.cloud,c&&c!=='clear'?WX.cloud/100:0,k);
  wxV.rain=lerp(wxV.rain,WX.rain,k);wxV.snow=lerp(wxV.snow,WX.snow?1:0,k);wxV.fog=lerp(wxV.fog,c==='fog'?1:0,k);
  wxV.storm=lerp(wxV.storm,WX.storm?1:0,k);
  const vis=c==='clear'?1:c==='partly'?0.65:0;
  wxV.sun=lerp(wxV.sun,sp.el!=null&&sp.el>0?vis:0,k);
  wxV.moon=lerp(wxV.moon,sp.el!=null&&sp.el<0?vis:0,k);
  /* le vent souffle depuis wind_bearing (0 = nord = −z, 90 = est = +x) : nuages et pluie partent à l'opposé */
  const b=(WX.windDir||0)*PI/180,ms=(WX.wind||0)/3.6;
  wxV.dx=-Math.sin(b);wxV.dz=Math.cos(b);wxV.sp=RM?0:Math.max(0.04,ms*0.06);wxV.tilt=Math.min(1.2,ms/6);
  WX_CLOUDS.forEach(q=>{
    q.x+=wxV.dx*wxV.sp*dt;q.z+=wxV.dz*wxV.sp*dt;
    const ox=q.x,oz=q.z;
    if(q.x>14)q.x-=22;else if(q.x<-8)q.x+=22;
    if(q.z>20)q.z-=28;else if(q.z<-8)q.z+=28;
    /* recyclé dans l'empreinte : on le repousse sur le bord le plus proche (gauche/droite ou devant/derrière) */
    if((q.x!==ox||q.z!==oz)&&wxInBase(q.x,q.z)){
      const dl=q.x+1.2,dr=7.2-q.x,dn=q.z+2,df=13.4-q.z,m=Math.min(dl,dr,dn,df);
      if(m===dl)q.x=-1.3;else if(m===dr)q.x=7.3;else if(m===dn)q.z=-2.1;else q.z=13.5;
    }
  });
  if(Math.max(wxV.rain,wxV.snow)>0.01&&!RM){
    const vy=wxV.snow>wxV.rain?1.3:9;
    WX_DROPS.forEach(p=>{p.y-=vy*dt;if(p.y<-1)wxDrop(p,true);});
  }
  /* éclairs : flash de 0,1 s toutes les 6 à 12 s, seulement par temps d'orage */
  wxV.flash=Math.max(0,wxV.flash-dt);
  if(WX.storm&&!RM){wxV.nextFlash-=dt;if(wxV.nextFlash<=0){wxV.flash=0.1;wxV.nextFlash=6+Math.random()*6;}}
}
/* le ciel vire vers une teinte de ciel couvert (gris clair, gris-bleu de pluie, gris d'orage, gris chaud de brouillard),
   assombrie la nuit ; ciel clair inchangé ; l'éclair le blanchit */
const WX_OVC=hex('#c3ccd2'),WX_RAINC=hex('#8fa0ad'),WX_POUR=hex('#5d6a75'),WX_STORMC=hex('#434d57'),WX_FOGC=hex('#a8a49c');
const wxSs=(a,b,x)=>{const u=clamp((x-a)/(b-a),0,1);return u*u*(3-2*u);};
function wxSky(top,bot){
  if(WX.off)return;
  const wr=wxSs(0,0.5,wxV.rain),c=mix3(mix3(WX_OVC,mix3(WX_RAINC,WX_POUR,wxSs(0.5,1,wxV.rain)),wr),WX_STORMC,wxV.storm);
  const o=mix3(c,WX_FOGC,wxV.fog),n=lerp(0.26,1,dayCur),f=wxV.flash>0?0.55:0;
  const w=Math.max(0.8*wxSs(0.15,0.9,wxV.cloud),0.9*wr,0.95*wxV.storm,0.9*wxV.fog);
  for(let i=0;i<3;i++){
    top[i]=lerp(lerp(top[i],o[i]*n,w),0.92,f);
    bot[i]=lerp(lerp(bot[i],Math.min(1,o[i]*n*1.05),w),0.88,f);
  }
}
/* composition « over » avec le shader additif : 1) assombrit le fond de a, 2) ajoute couleur×a */
function wxOver(mode,dark,lit){
  gl.blendFunc(gl.ZERO,gl.ONE_MINUS_SRC_COLOR);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(dark),gl.DYNAMIC_DRAW);bindLayout();gl.drawArrays(mode,0,dark.length/9);
  gl.blendFunc(gl.ONE,gl.ONE);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(lit),gl.DYNAMIC_DRAW);bindLayout();gl.drawArrays(mode,0,lit.length/9);
}
function wxDraw(t){
  if(WX.off)return;
  const arr=[],sp=wxSunPos();
  /* brouillard : voile plein écran de la couleur du ciel, par-dessus la maison */
  if(wxV.fog>0.01){
    gl.disable(gl.DEPTH_TEST);gl.useProgram(P_BG.p);gl.uniform1f(P_BG.u.uNight,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bufBg);bindLayout();
    gl.blendColor(0,0,0,0.4*wxV.fog);gl.blendFunc(gl.CONSTANT_ALPHA,gl.ONE_MINUS_CONSTANT_ALPHA);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.enable(gl.DEPTH_TEST);
  }
  /* soleil ou lune : disque doux et halo */
  if((wxV.sun>0.01||wxV.moon>0.01)&&sp.el!=null&&sp.az!=null){
    const moon=wxV.moon>wxV.sun,s=moon?wxV.moon:wxV.sun,az=(sp.az+(moon?180:0))*PI/180,el=(moon?-sp.el:sp.el)*PI/180,R=11;
    const p=[C0[0]+Math.sin(az)*Math.cos(el)*R,C0[1]+2+Math.sin(el)*R,C0[2]-Math.cos(az)*Math.cos(el)*R];
    const col=moon?[0.72,0.78,0.95]:[1,0.84,0.52],h=s*(moon?0.22:0.32);
    pushGlow(arr,p,p,moon?1.5:2.6,[col[0]*h,col[1]*h,col[2]*h]);
    pushGlow(arr,p,p,moon?0.42:0.62,[col[0]*s,col[1]*s,col[2]*s]);
  }
  gl.useProgram(P_GLOW.p);gl.uniformMatrix4fv(P_GLOW.u.uVP,false,cam.vp);
  gl.bindBuffer(gl.ARRAY_BUFFER,bufGlow);
  if(arr.length){
    gl.blendFunc(gl.ONE,gl.ONE);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.DYNAMIC_DRAW);bindLayout();
    gl.drawArrays(gl.TRIANGLES,0,arr.length/9);
  }
  /* nuages : sprites gris-blanc opaques (composition « over »), étirés dans le sens du vent, grisés par la pluie */
  if(wxV.cloud>0.01){
    const ck=0.38+0.42*wxV.cloud,fl=wxV.flash>0?0.25:0,D=[],A=[];
    const col=mix3(mix3([0.55,0.6,0.68],[0.86,0.89,0.92],dayCur),[0.48,0.53,0.6],0.35*wxV.rain+0.2*wxV.storm);
    WX_CLOUDS.forEach(q=>{
      const e=clamp(Math.min(q.x+8,14-q.x,q.z+8,20-q.z)/3,0,1),a=Math.min(0.95,ck*q.k*e*Math.min(1,wxV.cloud*2.5)),hx=wxV.dx*q.l/2,hz=wxV.dz*q.l/2;
      if(a<0.003||wxInBase(q.x,q.z))return;
      const P=[q.x-hx,q.y,q.z-hz],Q=[q.x+hx,q.y,q.z+hz];
      pushGlow(D,P,Q,q.r,[a,a,a]);
      pushGlow(A,P,Q,q.r,[Math.min(1,col[0]+fl)*a,Math.min(1,col[1]+fl)*a,Math.min(1,col[2]+fl)*a]);
    });
    if(D.length)wxOver(gl.TRIANGLES,D,A);
  }
  /* pluie (traits bleu-gris inclinés par le vent) ou neige (traits blancs lents qui ondulent) */
  const snow=wxV.snow>wxV.rain,amt=snow?wxV.snow:wxV.rain;
  if(amt>0.01){
    const n=Math.round(WX_NDROP*amt),len=snow?0.07:0.62,o=snow?0.8:Math.min(0.9,0.5+0.5*amt);
    const c=snow?[0.96,0.97,1]:mix3([0.62,0.7,0.82],[0.3,0.35,0.44],dayCur);
    const ox=-wxV.dx*wxV.tilt*len,oz=-wxV.dz*wxV.tilt*len,D=[],L=[];
    for(let i=0;i<n;i++){
      const p=WX_DROPS[i],sw=snow&&!RM?0.18:0,x=p.x+Math.sin(t*1.1+p.ph)*sw,z=p.z+Math.cos(t*0.9+p.ph)*sw;
      D.push(x+ox,p.y+len,z+oz,0,0,0,o,o,o,x,p.y,z,0,0,0,o,o,o);
      L.push(x+ox,p.y+len,z+oz,0,0,0,c[0]*o,c[1]*o,c[2]*o,x,p.y,z,0,0,0,c[0]*o,c[1]*o,c[2]*o);
    }
    wxOver(gl.LINES,D,L);
  }
}

const SUN=V.norm([0.38,0.8,0.55]),FILL=V.norm([-0.55,0.3,-0.4]);
function bindLayout(){
  gl.vertexAttribPointer(0,3,gl.FLOAT,false,36,0);
  gl.vertexAttribPointer(1,3,gl.FLOAT,false,36,12);
  gl.vertexAttribPointer(2,3,gl.FLOAT,false,36,24);
}
function drawItem(it){
  if(!it.show)return;
  const u=P_MAIN.u;
  gl.bindBuffer(gl.ARRAY_BUFFER,it.mesh.b);bindLayout();
  gl.uniformMatrix4fv(u.uModel,false,it.m);
  gl.uniform3fv(u.uTint,it.tint);gl.uniform3fv(u.uEmis,it.emis);
  gl.uniform1f(u.uEmisMix,it.mix);gl.uniform1f(u.uAlpha,it.alpha);
  gl.drawArrays(gl.TRIANGLES,0,it.mesh.n);
}
function pushGlow(arr,A,B,r,c){
  const R=cam.right,U=cam.up;
  let dx=V.dot(B,R)-V.dot(A,R),dy=V.dot(B,U)-V.dot(A,U);
  const len=Math.hypot(dx,dy);
  if(len<1e-4){dx=1;dy=0;}else{dx/=len;dy/=len;}
  const D=[(R[0]*dx+U[0]*dy)*r,(R[1]*dx+U[1]*dy)*r,(R[2]*dx+U[2]*dy)*r];
  const Pp=[(-R[0]*dy+U[0]*dx)*r,(-R[1]*dy+U[1]*dx)*r,(-R[2]*dy+U[2]*dx)*r];
  const L=len/r;
  const q=[
    [A[0]-D[0]-Pp[0],A[1]-D[1]-Pp[1],A[2]-D[2]-Pp[2],-1,-1],
    [A[0]-D[0]+Pp[0],A[1]-D[1]+Pp[1],A[2]-D[2]+Pp[2],-1,1],
    [B[0]+D[0]+Pp[0],B[1]+D[1]+Pp[1],B[2]+D[2]+Pp[2],L+1,1],
    [B[0]+D[0]-Pp[0],B[1]+D[1]-Pp[1],B[2]+D[2]-Pp[2],L+1,-1]
  ];
  [0,1,2,0,2,3].forEach(i=>{const p=q[i];arr.push(p[0],p[1],p[2],p[3],p[4],L,c[0],c[1],c[2]);});
}
function draw(t){
  const bgTop=mix3(hex('#0c2430'),hex('#bfe6dc'),dayCur),bgBot=mix3(hex('#1d4a50'),hex('#f6dcc6'),dayCur);
  wxSky(bgTop,bgBot);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.depthMask(true);
  gl.useProgram(P_BG.p);
  gl.bindBuffer(gl.ARRAY_BUFFER,bufBg);bindLayout();
  gl.uniform3fv(P_BG.u.uBgTop,bgTop);gl.uniform3fv(P_BG.u.uBgBot,bgBot);
  gl.uniform1f(P_BG.u.uH,canvas.height);gl.uniform1f(P_BG.u.uPx,dpr);
  gl.uniform1f(P_BG.u.uNight,frameU.night);gl.uniform1f(P_BG.u.uTime,RM?0:t);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clear(gl.DEPTH_BUFFER_BIT);
  const u=P_MAIN.u,d=dayCur;
  gl.useProgram(P_MAIN.p);
  gl.uniformMatrix4fv(u.uVP,false,cam.vp);
  gl.uniform3fv(u.uSunDir,SUN);gl.uniform3fv(u.uFillDir,FILL);
  gl.uniform3fv(u.uSunCol,mix3([0.13,0.16,0.25],[0.62,0.57,0.5],d));
  gl.uniform3fv(u.uFillCol,mix3([0.035,0.04,0.07],[0.13,0.15,0.22],d));
  gl.uniform3fv(u.uAmbSky,mix3([0.27,0.33,0.46],[0.52,0.54,0.6],d));
  gl.uniform3fv(u.uAmbGnd,mix3([0.16,0.18,0.31],[0.4,0.36,0.5],d));
  gl.uniform3fv(u.uBgTop,bgTop);gl.uniform3fv(u.uBgBot,bgBot);gl.uniform1f(u.uH,canvas.height);
  gl.uniform4fv(u['uLA[0]'],frameU.la);gl.uniform3fv(u['uLB[0]'],frameU.lb);gl.uniform3fv(u['uLC[0]'],frameU.lc);
  opaque.forEach(drawItem);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
  transp.forEach(drawItem);

  const arr=[],gk=lerp(1,0.22,dayCur);
  GLOWS.forEach(G=>{
    const v=byId[G.dev].v,s=Math.pow(v.level,0.6)*G.k*gk;
    if(s>0.004)pushGlow(arr,G.A,G.B,G.r,[v.rgb[0]*s,v.rgb[1]*s,v.rgb[2]*s]);
  });
  if(arr.length){
    gl.useProgram(P_GLOW.p);gl.uniformMatrix4fv(P_GLOW.u.uVP,false,cam.vp);
    gl.blendFunc(gl.ONE,gl.ONE);
    gl.bindBuffer(gl.ARRAY_BUFFER,bufGlow);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.DYNAMIC_DRAW);bindLayout();
    gl.drawArrays(gl.TRIANGLES,0,arr.length/9);
  }
  wxDraw(t);
  gl.depthMask(true);gl.disable(gl.BLEND);
}

function since(ts){const m=Math.floor((Date.now()-ts)/60000);return m<1?'à l’instant':m<60?'depuis '+m+' min':'depuis '+Math.floor(m/60)+' h';}
function agoTxt(ts){const m=Math.floor((Date.now()-ts)/60000);return m<1?'à l’instant':m<60?'il y a '+m+' min':'il y a '+Math.floor(m/60)+' h';}
function stateText(d){
  const s=d.s;
  if(d.pending)return'Non relié';
  if(d.offline)return'Hors ligne';
  switch(d.kind){
    case'plug':return s.on?'Allumé':'Éteint';
    case'light':if(capsOf(d)==='onoff')return s.on?(d.masc?'Allumé':'Allumée'):(d.masc?'Éteint':'Éteinte');return s.on?(d.masc?'Allumé':'Allumée')+' · '+s.bri+' %':(d.masc?'Éteint':'Éteinte');
    case'tv':return s.on?'Allumée · '+s.source:'Éteinte';
    case'speaker':return s.playing?'Lecture · volume '+s.vol:'En pause';
    case'camera':return camPowered(d)?(s.on?'Allumée':'Éteinte'):'En ligne';
    case'door':return(s.open?'Ouverte ':'Fermée ')+since(s.since);
    case'motion':return s.active?'Mouvement détecté':'Aucun mouvement';
    case'thermo':return fr(air[d.zone])+' °C';
    case'cover':return s.pos<=0?'Fermé':s.pos>=100?'Ouvert':'Ouvert · '+s.pos+' %';
    default:return!s.on?'Arrêté':(heating(d)?'Chauffe':'Au repos')+' · '+fr(air[d.zone])+' °C';
  }
}
function badgeColor(d){
  if(d.pending)return'var(--ink-soft)';
  if(d.kind==='light'&&d.s.on)return'rgb('+d.s.rgb.join(',')+')';
  if(d.kind==='door'&&d.s.open)return'var(--accent)';
  if(d.kind==='motion'&&d.s.active)return'var(--warm)';
  if((d.kind==='radiator'||d.kind==='climate')&&heating(d))return'var(--warm)';
  if(d.kind==='cover')return'var(--ink)';
  return isOn(d)||d.kind==='door'||d.kind==='motion'||d.kind==='thermo'?'var(--ink)':'var(--ink-soft)';
}
function rgb2hue(c){
  const r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),dl=mx-mn;
  if(dl<0.001)return 30;
  let h=mx===r?((g-b)/dl)%6:mx===g?(b-r)/dl+2:(r-g)/dl+4;
  return Math.round((h*60+360)%360);
}
function hue2rgb(h){
  const s=0.72,f=n=>{const k=(n+h/60)%6;return Math.round(255*(1-s*Math.max(0,Math.min(k,4-k,1))));};
  return[f(5),f(3),f(1)];
}

/* entités proposées : celles du bon domaine connues de Home Assistant, les libres d'abord */
function candidates(d,q0){
  const q=norm((q0==null?cfgUi.q:q0).trim()),doms=DOMAINS[d.kind]||[],out=[];
  Object.keys(ha.states).forEach(id=>{
    if(doms.indexOf(domOf(id))<0||d.ents.indexOf(id)>=0)return;
    /* on masque les réglages techniques des appareils (DND, crossfade, backlight…) */
    if(!q&&/_(do_not_disturb|child_lock|crossfade|loudness|night_sound|speech_enhancement|surround_enabled|surround_music_full_volume|tv_autoplay|ungroup_on_autoplay|delayed_power_on_state.*|identify|permit_join|backlight)$/.test(id))return;
    const st=ha.states[id],a=st.attributes||{},name=a.friendly_name||'',dc=a.device_class||'';
    if(d.kind==='thermo'&&dc!=='temperature'&&!/°[CF]/.test(a.unit_of_measurement||''))return;
    if(!q&&d.kind==='motion'&&dc&&!/motion|occupancy|presence|moving/.test(dc))return;
    if(!q&&d.kind==='door'&&dc&&!/door|window|opening|lock/.test(dc))return;
    if(q&&norm(id+' '+name).indexOf(q)<0)return;
    out.push({id,name,state:st.state,used:!!byEntity[id]});
  });
  out.sort((x,y)=>(x.used-y.used)||(x.name||x.id).localeCompare(y.name||y.id,'fr',{sensitivity:'base'}));
  return out;
}

/* ---------- consommation réelle : moyenne sur 7 jours, depuis l'onglet Énergie de Home Assistant ---------- */
const WATT_KEY='neoplex.watt',WATT_EVERY=3600000,DAYS=['dim','lun','mar','mer','jeu','ven','sam'];
const watt={data:null,busy:false,err:''};
try{const c=JSON.parse(localStorage.getItem(WATT_KEY)||'null');if(c&&c.t&&c.days)watt.data=c;}catch(_){}
function wattDone(){refreshChips();measure();if(ui.sel==='power')renderSheet();}
function wattFetch(force){
  if(!ha.ready||watt.busy)return;
  if(!force&&watt.data&&Date.now()-watt.data.t<WATT_EVERY)return;
  watt.busy=true;watt.err='';
  const fail=m=>{watt.busy=false;watt.err=m;watt.data=null;try{localStorage.removeItem(WATT_KEY);}catch(_){}wattDone();};
  haSend({type:'energy/get_prefs'},r=>{
    const src=r.success&&r.result&&(r.result.energy_sources||[]).filter(x=>x.stat_energy_from)[0];
    if(!src){fail(r.success?'aucune source d’énergie':haErrTxt(r));return;}
    const id=src.stat_energy_from,now=Date.now();
    haSend({type:'recorder/statistics_during_period',start_time:new Date(now-8*86400000).toISOString(),end_time:new Date(now).toISOString(),
      statistic_ids:[id],period:'day',types:['sum']},r2=>{
      const ts=v=>typeof v==='number'?v:Date.parse(v);
      const rows=(r2.success&&r2.result&&r2.result[id]||[]).filter(x=>x.sum!=null).sort((a,b)=>ts(a.start)-ts(b.start)).slice(-8);
      if(rows.length<2){fail(r2.success?'pas assez de données':haErrTxt(r2));return;}
      const a=rows[0],b=rows[rows.length-1],wh=b.sum-a.sum,h=(ts(b.start)-ts(a.start))/3600000;
      if(!(h>0)||!(wh>=0)){fail('données incohérentes');return;}
      const days=rows.slice(1).map((x,i)=>({t:ts(rows[i].start),kwh:Math.max(0,(x.sum-rows[i].sum)/1000)}));
      watt.data={t:Date.now(),id,w:wh/h,kwhDay:wh/1000/(h/24),total:days.reduce((s,x)=>s+x.kwh,0),n:Math.round(h/24),days};
      watt.busy=false;
      try{localStorage.setItem(WATT_KEY,JSON.stringify(watt.data));}catch(_){}
      wattDone();
    });
  });
}

      '<button class="btn" id="wRetry" data-act="wretry">Réessayer</button>';
